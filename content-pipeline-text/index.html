html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--cn);-webkit-font-smoothing:antialiased;cursor:pointer}

#wrap{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  transform-origin:0 0;background:#07060D}

/* ── 背景 ── */
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;will-change:transform;
  animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(calc(var(--x)*-1),calc(var(--y)*-1),0)}
  to{transform:translate3d(var(--x),var(--y),0)}}
.dots{position:absolute;inset:-40px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1.8px,transparent 1.8px);
  background-size:64px 64px}
.vig{position:absolute;inset:0;background:radial-gradient(115% 90% at 50% 46%,
  transparent 36%,rgba(0,0,0,.66) 100%)}

/* ── 頂部小標 ── */
.kick{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:center;
  align-items:center;gap:18px;font-size:24px;font-weight:900;letter-spacing:.42em;
  color:rgba(196,168,255,.94);transition:opacity .5s ease}
.kick i{display:block;width:52px;height:1px;background:rgba(196,168,255,.55)}
.kick .ytlogo{width:46px;height:33px;flex-shrink:0}
.merged .kick{opacity:0}

/* ── 七張浮動卡 ── */
.card{position:absolute;width:372px;height:248px;border-radius:26px;
  background:linear-gradient(180deg,rgba(24,19,38,.94),rgba(12,10,20,.94));
  border:1.5px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  opacity:.22;
  transition:opacity .55s ease,border-color .5s ease,box-shadow .6s ease,
    transform .85s cubic-bezier(.45,.05,.2,1);
  will-change:transform;z-index:2}
.card.on{opacity:1}
.card .float{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  animation:bob var(--bd) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-7px) rotate(var(--tilt))}
  to{transform:translateY(7px) rotate(calc(var(--tilt) * -1))}}

.card .tag{position:absolute;top:18px;left:22px;font-family:var(--num);
  font-size:15px;font-weight:900;letter-spacing:.26em;color:var(--c);
  opacity:.35;transition:opacity .45s ease}
.card.on .tag{opacity:1}

.coin{position:relative;width:104px;height:104px;border-radius:50%;
  background:#100C1A;border:1.5px solid rgba(255,255,255,.10);
  display:grid;place-items:center;transition:border-color .5s,box-shadow .6s}
.card.on .coin{border-color:color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 0 34px color-mix(in srgb,var(--c) 30%,transparent)}
.coin svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.coin svg.ring circle{fill:none;stroke:var(--c);stroke-width:3;
  stroke-dasharray:302;stroke-dashoffset:302;stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.2,1) .06s}
.card.on .coin svg.ring circle{stroke-dashoffset:0}
.coin .ic{color:var(--c);opacity:.18;transition:opacity .45s ease .14s}
.card.on .coin .ic{opacity:1}

.name{font-size:34px;font-weight:900;letter-spacing:.01em;color:#5F5570;
  transition:color .45s ease,text-shadow .45s ease;white-space:nowrap}
.card.on .name{color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.7)}

/* 匯聚 */
.card.mv{transition:transform .85s cubic-bezier(.45,.05,.2,1),
  opacity .3s ease .62s,border-color .4s,box-shadow .4s;opacity:0}

/* ── 串成嘅流水線 ── */
.pipe{position:absolute;left:40px;top:330px;width:1840px;height:320px;
  border-radius:160px;opacity:0;transform:scale(.96);
  background:linear-gradient(100deg,rgba(124,58,237,.24),rgba(34,211,238,.13));
  border:1.5px solid rgba(139,92,246,.48);overflow:hidden;
  box-shadow:0 0 90px rgba(124,58,237,.26),inset 0 0 60px rgba(124,58,237,.08);
  transition:opacity .6s ease .75s,transform .8s cubic-bezier(.2,.8,.2,1) .75s;
  z-index:1}
.merged .pipe{opacity:1;transform:none}
.pipe::before{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.12) 50%,transparent 80%);
  transform:translateX(-100%)}
.merged .pipe::before{animation:sweep 4.6s cubic-bezier(.4,0,.2,1) 1.9s infinite}
@keyframes sweep{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}

.mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mini .rail{position:absolute;z-index:1;left:260px;top:137px;width:1320px;height:2.5px;
  border-radius:2px;background:linear-gradient(90deg,#8B5CF6,#22D3EE);opacity:.6;
  box-shadow:0 0 18px rgba(139,92,246,.4)}
.mini .m{position:relative;z-index:2;width:200px;display:flex;flex-direction:column;
  align-items:center;gap:12px;opacity:0;transition:opacity .45s ease}
.merged .mini .m{opacity:1}
.mini .dot{width:134px;height:134px;border-radius:50%;display:grid;place-items:center;
  background:#0A0812;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);
  color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 22%,transparent)}
.mini .dot svg{width:56px;height:56px}
.mini span{font-size:26px;font-weight:900;color:rgba(243,239,255,.88);white-space:nowrap}

/* ── 收尾大字 ── */
.cap{position:absolute;left:0;right:0;top:712px;text-align:center;opacity:0;
  transform:translateY(18px);
  transition:opacity .7s ease 1.55s,transform .8s cubic-bezier(.2,.8,.2,1) 1.55s}
.merged .cap{opacity:1;transform:none}
.cap b{display:block;font-size:64px;font-weight:900;color:var(--ink)}
.cap b i{font-style:normal;color:var(--gold)}
.cap em{display:block;margin-top:22px;font-style:normal;font-size:32px;
  color:rgba(243,239,255,.55);letter-spacing:.06em}

/* ── 底部提示 ── */
.foot{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;
  gap:44px;align-items:center;font-size:26px;color:rgba(243,239,255,.5);
  transition:opacity .4s ease}
.foot b{font-family:var(--num);font-size:28px;color:var(--gold);letter-spacing:.06em}
.foot kbd{font-family:var(--num);background:rgba(255,255,255,.1);border-radius:8px;
  padding:3px 12px;font-size:23px;color:rgba(255,255,255,.8)}
.merged .foot{opacity:0}

#hud{position:fixed;right:18px;bottom:14px;z-index:20;display:flex;gap:16px;
  font-family:var(--num);font-size:13px;letter-spacing:.1em;
  color:rgba(243,239,255,.32);user-select:none}
body.nohud #hud{display:none}

#help{position:fixed;inset:0;z-index:30;background:rgba(6,5,11,.96);display:none;
  place-items:center;color:var(--ink)}
#help.on{display:grid}
#help .card2{background:rgba(255,255,255,.05);border:1px solid rgba(168,85,247,.3);
  border-radius:22px;padding:34px 44px;min-width:520px;font-size:19px}
#help h3{margin:0 0 18px;color:var(--gold);font-size:22px;letter-spacing:.1em}
#help td{padding:8px 0;color:var(--soft)}
#help td:first-child{padding-right:40px;color:var(--amber);font-family:var(--num)}

/* ── 置頂：返回總目錄 ── */
#homeLink{position:fixed;left:16px;top:16px;z-index:60;
  font-family:"PingFang HK","Heiti TC",sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.1em;color:rgba(255,255,255,.78);text-decoration:none;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:9px 15px;backdrop-filter:blur(8px);
  transition:background .25s,color .25s,opacity .25s}
#homeLink:hover{background:rgba(0,0,0,.72);color:#fff}
body.nohud #homeLink{opacity:0;pointer-events:none}

/* ── 實證板（shotcraft: graze-face-tour） ── */
#proof{position:absolute;inset:0;z-index:32;opacity:0;pointer-events:none;
  background:radial-gradient(120% 96% at 50% 40%,#150E22,#07030C 78%);transition:opacity .45s ease}
.proofon #proof{opacity:1}
#proof h2{position:absolute;left:0;right:0;top:52px;margin:0;text-align:center;z-index:6;
  font-size:44px;font-weight:900;letter-spacing:.01em;color:var(--ink)}
#proof h2 i{font-style:normal;color:var(--gold)}
#proof .sub3{position:absolute;left:0;right:0;top:118px;text-align:center;z-index:6;
  font-size:22px;letter-spacing:.05em;color:rgba(243,239,255,.52)}
#proof .foot3{position:absolute;left:0;right:0;bottom:30px;text-align:center;z-index:6;
  font-size:19px;letter-spacing:.05em;color:rgba(243,239,255,.42)}
#scene2{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 46%;z-index:2}
#cam2{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 46%;will-change:transform}
.plate2{position:absolute;border-radius:16px;overflow:hidden;background:#0B0714;
  border:1px solid rgba(168,85,247,.34);box-shadow:0 34px 90px rgba(0,0,0,.66)}
.plate2 img{display:block;width:100%;height:auto}
#pa{left:140px;top:236px;width:1180px}
#pb{left:1378px;top:236px;width:372px}
.lb{position:absolute;display:inline-flex;align-items:center;padding:8px 16px;border-radius:10px;
  background:rgba(14,8,24,.95);border:1px solid rgba(168,85,247,.60);
  font-size:19px;font-weight:900;color:#EBD9FF;white-space:nowrap;z-index:3;
  will-change:transform,opacity;transform-origin:50% 100%}
.lb .shd{position:absolute;inset:2px;border-radius:9px;background:rgba(0,0,0,.75);
  filter:blur(12px);z-index:-1;will-change:transform,opacity,filter}

</style>

    return `<div class="blob" style="left:${(p[0]*1920-p[2]).toFixed(0)}px;top:${(p[1]*1080-p[2]).toFixed(0)}px;
      width:${p[2]*2}px;height:${p[2]*2}px;
      background:radial-gradient(circle,rgba(${hex(c)},.15) 0%,rgba(${hex(c)},.05) 42%,rgba(0,0,0,0) 70%);
      --x:${(30+Math.random()*46).toFixed(0)}px;--y:${(22+Math.random()*38).toFixed(0)}px;
      --d:${(11+Math.random()*8).toFixed(1)}s"></div>`;
  }).join("") + '<div class="dots"></div>';
})();

/* ── 七張卡 ── */
const cards = STEPS.map((s, i) => {
  const el = document.createElement("div");
  el.className = "card";
  el.style.left = (s.x - 186) + "px";
  el.style.top  = (s.y - 124) + "px";
  el.style.setProperty("--c", s.c);
  el.style.setProperty("--tilt", ((i % 2 ? 1 : -1) * (1 + Math.random() * 1.4)).toFixed(2) + "deg");
  el.style.setProperty("--bd", (4.5 + Math.random() * 2.5).toFixed(1) + "s");
  el.innerHTML = `<div class="float">
      <div class="tag">STEP ${i + 1}</div>
      <div class="coin">
        <svg class="ring" viewBox="0 0 104 104"><circle cx="52" cy="52" r="48"/></svg>
        <div class="ic" style="width:50px;height:50px">${ICONS[s.icon]}</div>
      </div>
      <div class="name">${s.label}</div>
    </div>`;
  el.querySelector(".ic svg").setAttribute("width","50");
  el.querySelector(".ic svg").setAttribute("height","50");
  stage.appendChild(el);
  return { el, ...s };
});

/* ── 合成後嘅迷你節點 ── */
STEPS.forEach((s) => {
  const m = document.createElement("div");
  m.className = "m";
  m.style.setProperty("--c", s.c);
  m.innerHTML = `<div class="dot">${ICONS[s.icon]}</div><span>${s.label}</span>`;
  miniEl.appendChild(m);
});

/* ══════════ 音效：突突聲 ══════════ */
let ac = null, out = null, muted = false;
function audio(){
  try {
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination);
      if (muted) out.gain.value = 0;
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tick(o = {}){
  if (!ac || muted) return;
  const {delay = 0, gain = .26, f = 240} = o;
  const t = ac.currentTime + delay;
  const len = Math.floor(ac.sampleRate * 0.05);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){ const e = 1 - i/len; d[i] = (Math.random()*2-1) * e * e; }
  const src = ac.createBufferSource(); src.buffer = buf;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(hp); hp.connect(g); g.connect(out);
  src.start(t); src.stop(t + .06);
  const osc = ac.createOscillator(), g2 = ac.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(f * 2.1, t);
  osc.frequency.exponentialRampToValueAtTime(f * .65, t + .06);
  g2.gain.setValueAtTime(.0001, t);
  g2.gain.exponentialRampToValueAtTime(gain * .55, t + .008);
  g2.gain.exponentialRampToValueAtTime(.0001, t + .07);
  osc.connect(g2); g2.connect(out); osc.start(t); osc.stop(t + .09);
}
function boom(t, gain = .34){
  if (!ac || muted) return;
  const tt = ac.currentTime + t;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(112, tt);
  osc.frequency.exponentialRampToValueAtTime(36, tt + .6);
  g.gain.setValueAtTime(.0001, tt);
  g.gain.exponentialRampToValueAtTime(gain, tt + .02);
  g.gain.exponentialRampToValueAtTime(.0001, tt + .62);
  osc.connect(g); g.connect(out); osc.start(tt); osc.stop(tt + .65);
}
function sfxStep(i){
  if (!ac || muted) return;
  tick({delay: 0,    gain: .30, f: 200 + i * 12});
  tick({delay: .062, gain: .17, f: 268 + i * 12});
}
function sfxChain(){
  if (!ac || muted) return;
  [0, .07, .13, .175, .215, .248, .276, .30]
    .forEach((dl, k) => tick({delay: dl, gain: .24, f: 170 + k * 16}));
  boom(.34);
}

/* ══════════ 狀態 ══════════ */
let revealed = 0;
let merged = false;

function hud(){
  document.getElementById("muteState").textContent = muted ? "🔇 音效關" : "🔊 突突聲";
  document.getElementById("pageState").textContent = proofOpen ? "每日搵料" : merged ? "串成一條" : `${revealed} / 8 步`;
}
function hint(){
  counter.innerHTML = `第 <b>${revealed}</b> / 8 步`;
  hintTxt.innerHTML = proofOpen ? '撳一下 → <b>下一條流水線</b>（<kbd>←</kbd> 返）'
    : revealed === 0 ? '撳一下 <kbd>空白</kbd> → 出一步'
    : revealed < 8 ? '撳一下 <kbd>空白</kbd> → 出下一步'
    : merged ? '撳一下 → <b>睇每日搵料</b>'
    : '撳一下 → <b>串成一條流水線</b>';
  hud();
}

/* 條線對準圓心（圓有實色底，所以只會喺圓與圓之間見到） */
function layoutRail(){
  const dots = [...miniEl.querySelectorAll(".dot")];
  if (dots.length < 2) return;
  const mr = miniEl.getBoundingClientRect();
  const k = mr.width / 1840;
  if (!k) return;
  const a = dots[0].getBoundingClientRect();
  const b = dots[dots.length - 1].getBoundingClientRect();
  const cx1 = (a.left - mr.left) / k + a.width / (2 * k);
  const cx2 = (b.left - mr.left) / k + b.width / (2 * k);
  const cy  = (a.top - mr.top) / k + a.height / (2 * k);
  railEl.style.left = cx1.toFixed(1) + "px";
  railEl.style.width = Math.max(0, cx2 - cx1).toFixed(1) + "px";
  railEl.style.top = (cy - 1.25).toFixed(1) + "px";
}

function showCard(i){ cards[i].el.classList.add("on"); }
function hideCard(i){ cards[i].el.classList.remove("on"); }

/* 串連 */
function chain(){
  if (merged) return;
  audio(); sfxChain();
  const barY = 490;                        /* 長條中心（330 + 160） */
  cards.forEach((c, i) => {
    const dx = (260 + i * 200) - c.x;
    const dy = barY - c.y;
    c.el.style.transitionDelay = (i * 0.055).toFixed(3) + "s";
    c.el.classList.add("mv");
    c.el.style.transform =
      `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(.30)`;
  });
  stage.classList.add("merged");
  merged = true;
  layoutRail();
  setTimeout(layoutRail, 700);
  setTimeout(layoutRail, 1600);
  hud();
}
function unchain(){
  if (!merged) return;
  stage.classList.remove("merged");
  cards.forEach((c) => {
    c.el.classList.remove("mv");
    c.el.style.transitionDelay = "0s";
    c.el.style.transform = "";
  });
  merged = false;
  hud();
}


/* ── 實證板：graze-face-tour（貼面游走 + 文字空中貼落） ── */
let proofOpen = false, tourRAF = 0, tourT0 = 0;
const LABELS = [
  { id:"la1", at:0.35 },
  { id:"la2", at:1.05 },
  { id:"lb1", at:2.10 }
];
const TOUR = [
  {t:0.0, cam:[1.34, -14, 210]},
  {t:0.9, cam:[1.34, -14, 210]},
  {t:2.2, cam:[1.34,  10, -240]},
  {t:3.2, cam:[1.34,  10, -240]},
  {t:4.3, cam:[1.00,  -5, 0]},
  {t:5.4, cam:[1.00,  -5, 0]}
];
const eIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const eFall = t => t*t*t;

function placeLabels(hMap){
  LABELS.forEach(({id}) => {
    const el = document.getElementById(id); if (!el) return;
    const h = hMap[id] || 0;
    const shd = el.querySelector(".shd");
    el.style.transform = `translate3d(0,${(-h*0.12).toFixed(1)}px,${h.toFixed(1)}px)`;
    el.style.opacity = 1;
    if (shd){
      shd.style.opacity = (0.62 * h/150).toFixed(3);
      shd.style.filter = `blur(${(5 + 16*h/150).toFixed(1)}px)`;
      shd.style.transform = `translate3d(0,${(8 + 26*h/150).toFixed(1)}px,0)`;
    }
  });
}
function tourFrame(now){
  const t = (now - tourT0) / 1000;
  if (t < 0){ tourRAF = requestAnimationFrame(tourFrame); return; }
  let a = TOUR[0], b = TOUR[0];
  for (let i=0;i<TOUR.length-1;i++){ if (t >= TOUR[i].t){ a = TOUR[i]; b = TOUR[i+1]; } }
  if (t >= TOUR[TOUR.length-1].t){ a = b = TOUR[TOUR.length-1]; }
  const k = (a===b) ? 1 : Math.min(1, (t - a.t) / Math.max(1e-3, b.t - a.t));
  const e = eIO(k);
  const cam = a.cam.map((v,i) => v + (b.cam[i]-v)*e);
  const c = document.getElementById("cam2");
  if (c) c.style.transform = `scale(${cam[0].toFixed(3)}) rotateY(${cam[1].toFixed(2)}deg) translate3d(${cam[2].toFixed(1)}px,0,0)`;
  const hm = {};
  LABELS.forEach((L) => {
    const d = t - L.at;
    hm[L.id] = d <= 0 ? 150 : (d >= 0.62 ? 0 : 150 * (1 - eFall(d/0.62)));
  });
  placeLabels(hm);
  if (t < 5.6) tourRAF = requestAnimationFrame(tourFrame);
}

function openProof(){
  if (!merged) return;
  proofOpen = true;
  document.getElementById("stage").classList.add("proofon");
  cancelAnimationFrame(tourRAF);
  const c = document.getElementById("cam2");
  if (c) c.style.transform = "scale(1) rotateY(-5deg) translate3d(0,0,0)";
  const hm = {}; LABELS.forEach(L => hm[L.id] = 0); placeLabels(hm);
  tourT0 = performance.now() + 50;
  tourRAF = requestAnimationFrame(tourFrame);
  hud(); hint();
}
function closeProof(){
  proofOpen = false;
  document.getElementById("stage").classList.remove("proofon");
  cancelAnimationFrame(tourRAF);
  hud(); hint();
}

/* ── 操作 ── */
function next(){
  audio();
  if (proofOpen){ return goNextDeck(); }
  if (merged){ openProof(); return; }
  if (revealed < 8){ showCard(revealed); revealed++; sfxStep(revealed - 1); hint(); }
  else chain();
}
function goPrevDeck(){
  try{ if (window.self !== window.top){ parent.postMessage({ type:"goto", id:"platform-features-end" }, "*"); return; } }catch(e){}
  location.href = "../platform-features/?at=end";
}
function prev(){
  if (proofOpen) return closeProof();
  if (merged) return unchain();
  if (revealed > 0){ revealed--; hideCard(revealed); hint(); }
  else goPrevDeck();
}
function reset(){
  proofOpen = false;
  cancelAnimationFrame(tourRAF);
  document.getElementById("stage").classList.remove("proofon");
  unchain();
  cards.forEach((c) => { c.el.classList.remove("on","mv"); c.el.style.transform = ""; });
  revealed = 0; hint();
}
function jumpEnd(){
  while (revealed < 8){ showCard(revealed); revealed++; }
  hint();
  setTimeout(chain, 420);
}
if (location.search.indexOf("at=end") >= 0){
  var _t = 0;
  var _iv = setInterval(function(){
    if (_t++ > 80 || proofOpen){ clearInterval(_iv); return; }
    if (merged){ openProof(); clearInterval(_iv); return; }
    if (revealed < STEPS.length){ document.getElementById("stage").classList.add("started"); showCard(revealed); revealed++; return; }
    chain();
  }, 45);
}
function replay(){ if (merged){ unchain(); setTimeout(chain, 320); } }

stage.addEventListener("click", next);
/* ── 撳到最後一下 → 去下一條流水線 ── */
const NEXT_DECK = "youtube-pipeline-flow";
function goNextDeck(){
  try {
    if (window.self !== window.top){ parent.location.hash = "#" + NEXT_DECK; return; }
  } catch (e) {}
  location.href = "../" + NEXT_DECK + "/";
}

addEventListener("keydown", (e) => {
  const k = e.key;
  if ([" ","ArrowRight","ArrowDown","PageDown","Enter"].includes(k)){ e.preventDefault(); next(); }
  else if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){ e.preventDefault(); prev(); }
  else if (k === "Home") reset();
  else if (k === "End") jumpEnd();
  else if (k === "m" || k === "M"){ muted = !muted; if (out) out.gain.value = muted ? 0 : .55; hud(); }
  else if (k === "r" || k === "R") replay();
  else if (k === "f" || k === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === "h" || k === "H") document.body.classList.toggle("nohud");
  else if (k === "?" || k === "/") document.getElementById("help").classList.toggle("on");
  else if (k === "Escape") document.getElementById("help").classList.remove("on");
});
document.getElementById("help").addEventListener("click", (e) => {
  if (e.target.id === "help") e.currentTarget.classList.remove("on");
});

/* ── 縮放：任何窗口都完整顯示 ── */
function fit(){
  const vv = window.visualViewport;
  const w = Math.max(1, Math.floor(vv ? vv.width : innerWidth));
  const h = Math.max(1, Math.floor(vv ? vv.height : innerHeight));
  const s = Math.min(w / 1920, h / 1080);
  stage.style.transform =
    `translate(${Math.round((w - 1920*s)/2)}px,${Math.round((h - 1080*s)/2)}px) scale(${s})`;
  requestAnimationFrame(layoutRail);
}
let q = false;
const queueFit = () => { if (q) return; q = true; requestAnimationFrame(() => { q = false; fit(); }); };
addEventListener("resize", queueFit);
addEventListener("orientationchange", queueFit);
if (window.visualViewport){
  visualViewport.addEventListener("resize", queueFit);
  visualViewport.addEventListener("scroll", queueFit);
}
if (window.ResizeObserver) new ResizeObserver(queueFit).observe(document.documentElement);
document.addEventListener("fullscreenchange", queueFit);
fit();
hint();
</script>
<script>
/* gesture bridge：向下撳／向下滑＝下一版，向上撳／向上滑＝上一版 */
(function(){
  if (window.__gestureBridge) return;
  window.__gestureBridge = true;
  var lock = 0, swallow = false;
  function fire(key){
    window.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
  }
  var lockDir = { up: 0, down: 0 };
  window.addEventListener("wheel", function(e){
    if (Math.abs(e.deltaY) < 22) return;
    var dir = e.deltaY > 0 ? "down" : "up", now = Date.now();
    if (now - lockDir[dir] < 620) return;
    lockDir[dir] = now;
    fire(dir === "down" ? "ArrowRight" : "ArrowLeft");
  }, { passive: true });
  var ty = 0, tx = 0;
  window.addEventListener("touchstart", function(e){
    var t = e.touches[0]; ty = t.clientY; tx = t.clientX;
  }, { passive: true });
  window.addEventListener("touchend", function(e){
    var t = e.changedTouches[0], dy = t.clientY - ty, dx = t.clientX - tx;
    if (Math.abs(dy) < 54 || Math.abs(dy) < Math.abs(dx)) return;
    swallow = true;
    setTimeout(function(){ swallow = false; }, 420);
    fire(dy < 0 ? "ArrowLeft" : "ArrowRight");
  }, { passive: true });
  window.addEventListener("click", function(e){
    if (swallow){ e.stopPropagation(); e.preventDefault(); swallow = false; }
  }, true);
})();
</script>
<script>
if (!window.__escBridge){ window.__escBridge = true;
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ try{ parent.postMessage({ type:"escape" }, "*"); }catch(err){} }
  });
}
</script>
