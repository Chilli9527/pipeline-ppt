<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>加入 WhatsApp 群組 · AI 流水線</title>
<style>
:root{--ink:#F4F7F2;--dim:#9AA6A0;--line:rgba(255,255,255,.13);--green:#C6F432;--gold:#D9A96A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08090B;color:var(--ink);overflow:hidden;
  font:16px/1.6 "PingFang HK","PingFang TC","Noto Sans TC",-apple-system,sans-serif;}
body{background:radial-gradient(110% 100% at 80% 4%,#1A2228,#0A0D10 64%)}
.wrap{position:fixed;inset:0;display:grid;grid-template-columns:1.15fr .85fr;
  align-items:center;gap:clamp(20px,5vw,90px);padding:clamp(28px,6vh,80px) clamp(24px,6vw,110px)}
.kick{font-size:clamp(10px,1vw,13px);letter-spacing:.3em;color:var(--green);font-weight:900;margin-bottom:clamp(10px,2vh,20px)}
h1{font-size:clamp(30px,5vw,72px);line-height:1.06;letter-spacing:-.02em;font-weight:900;margin-bottom:clamp(12px,2.4vh,26px)}
h1 .y{color:var(--green)}
.lede{font-size:clamp(15px,1.6vw,24px);color:#C3CCC6;line-height:1.5;margin-bottom:clamp(14px,2.6vh,30px)}
ul{list-style:none;display:flex;flex-direction:column;gap:clamp(7px,1.4vh,14px)}
li{font-size:clamp(13px,1.4vw,20px);color:#DCE4DE;padding-left:26px;position:relative;line-height:1.4}
li::before{content:"";position:absolute;left:6px;top:.58em;width:9px;height:9px;border-radius:50%;
  background:var(--green);opacity:.85}
.foot{margin-top:clamp(16px,3vh,36px);font-size:clamp(11px,1.1vw,15px);letter-spacing:.2em;color:#7E8A86;font-weight:800}
.qrside{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,22px)}
.qrbox{background:#fff;border-radius:clamp(14px,2vw,26px);padding:clamp(12px,2vw,26px);
  box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 6px rgba(198,244,50,.16)}
.qrbox img{display:block;width:clamp(180px,24vw,410px);height:auto;image-rendering:auto}
.qrside .cap{font-size:clamp(12px,1.3vw,18px);font-weight:800;letter-spacing:.08em;color:#E8EFE9;text-align:center}
.qrside .cap b{color:var(--green)}
.brandline{font-size:clamp(10px,1vw,13px);letter-spacing:.24em;color:#6E7A74;font-weight:800}
.fallback{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-top:clamp(4px,1vh,10px)}
.fallback span{font-size:clamp(11px,1.1vw,14px);color:#8C9A94}
.fallback a{font-size:clamp(12px,1.2vw,15px);font-weight:800;color:var(--green);text-decoration:none;
  border-bottom:1px solid rgba(198,244,50,.4);padding-bottom:1px}
.fallback button{font:inherit;font-size:clamp(11px,1.1vw,13px);font-weight:800;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#DDE6E0;
  border-radius:8px;padding:5px 10px}
.fallback button:hover{background:rgba(255,255,255,.14)}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;align-content:center;gap:26px;padding:30px 22px;text-align:center}
  ul{align-items:flex-start;text-align:left;display:inline-flex}
  .qrside{order:-1}
  .qrbox img{width:clamp(170px,52vw,280px)}
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="kick">NEXT STEP · 下一步</div>
    <h1>加入 WhatsApp 群組<br><span class="y">取得最新資訊</span></h1>
    <p class="lede">掃一掃個碼，入群就收到：</p>
    <ul>
      <li>最新 AI 流水線玩法同實測結果</li>
      <li>講座／課程時間，第一時間通知</li>
      <li>預約傾你生意要開邊幾條線</li>
    </ul>
    <div class="foot">AI Lion ｜ lion88.ai</div>
  </div>
  <div class="qrside">
    <div class="qrbox"><img src="assets/whatsapp-qr.png" alt="WhatsApp 群組 QR Code"></div>
    <div class="cap">用手機 <b>掃一掃</b> · 加入群組</div>
    <div class="fallback">
      <span>掃唔到？</span>
      <a href="https://chat.whatsapp.com/K9md76bQaFHLSQX0CZm3HH" target="_blank" rel="noopener">撳呢度開群組</a>
      <button id="copyBtn" type="button">複製連結</button>
    </div>
    <div class="brandline">WHATSAPP GROUP</div>
  </div>
</div>
<script>
(function(){
  var url = "https://chat.whatsapp.com/K9md76bQaFHLSQX0CZm3HH";
  var b = document.getElementById("copyBtn");
  if (!b) return;
  b.addEventListener("click", function(e){
    e.stopPropagation();
    function done(){ b.textContent = "已複製"; setTimeout(function(){ b.textContent = "複製連結"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ prompt("複製呢條連結：", url); });
    } else { prompt("複製呢條連結：", url); }
  });
})();
</script>
<script>
/* 同其他版面一致：↓／→ 下一版，↑／← 上一版（呢頁之前完全冇導航） */
(function(){
  function send(id){
    try{ if (window.self !== window.top){ parent.postMessage({ type:"goto", id:id }, "*"); return true; } }catch(e){}
    return false;
  }
  function next(){ if(!send("intro")) location.href = "intro-seminar.html"; }
  function prev(){ if(!send("ai-staff-2")) location.href = "ai-staff.html?at=2"; }
  addEventListener("keydown", function(e){
    if ([" ","ArrowRight","ArrowDown","PageDown","Enter"].indexOf(e.key) >= 0){ e.preventDefault(); next(); }
    else if (["ArrowLeft","ArrowUp","PageUp","Backspace"].indexOf(e.key) >= 0){ e.preventDefault(); prev(); }
  });
  var ty = 0;
  addEventListener("touchstart", function(e){ ty = e.touches[0].clientY; }, {passive:true});
  addEventListener("touchend", function(e){
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dy) < 54) return;
    if (dy < 0) prev(); else next();
  }, {passive:true});
})();
</script>
</body>
</html>
