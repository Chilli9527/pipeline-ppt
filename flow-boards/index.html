<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>AI 流水線 · Infographic 版</title>
<style>
:root{
  --navy:#1e2a5a; --ink:#25314f; --dim:#7c86a6;
  --blue:#3b82f6; --purple:#8b5cf6; --green:#10b981; --amber:#f59e0b; --rose:#f43f5e; --cyan:#06b6d4;
  --card:#ffffff; --line:#e3e9f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
  background:linear-gradient(150deg,#eaf2ff 0%,#f6f3ff 38%,#fff 100%);
  color:var(--ink); overflow:hidden;
}
/* pastel blobs */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);z-index:0}
body::before{width:520px;height:520px;left:-140px;top:-160px;background:rgba(147,197,253,.35)}
body::after{width:480px;height:480px;right:-120px;bottom:-180px;background:rgba(196,181,253,.30)}
#stage{position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;padding:26px}
#page{width:min(1180px,96vw);height:min(760px,94vh);overflow:auto;background:var(--card);
  border-radius:28px;box-shadow:0 18px 60px rgba(30,58,138,.12),0 2px 8px rgba(30,58,138,.06);
  padding:34px 40px 30px;scrollbar-width:thin}
.spark{position:fixed;z-index:2;font-size:22px;opacity:.8;pointer-events:none}
.sp1{top:7%;left:8%;color:#f59e0b}.sp2{top:12%;right:10%;color:#8b5cf6}
.sp3{bottom:10%;left:6%;color:#3b82f6}.sp4{bottom:14%;right:7%;color:#10b981}

/* ── header ── */
.kick{font-size:12px;font-weight:800;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
h1.title{font-size:clamp(28px,4.2vw,46px);font-weight:900;letter-spacing:-.01em;line-height:1.15;margin-top:6px}
h1.title .b{color:var(--navy)} h1.title .u{color:var(--blue)} h1.title .p{color:var(--purple)}
h1.title .g{color:var(--green)} h1.title .a{color:var(--amber)} h1.title .r{color:var(--rose)}
.sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:15px}
.sub .d{width:7px;height:7px;border-radius:50%}
.dots{color:var(--dim);font-weight:700}

/* ── panels ── */
.panel{border-radius:18px;border:1.5px solid var(--line);background:#fbfcff;padding:14px 16px;margin-top:14px}
.panel h3{font-size:12.5px;font-weight:900;letter-spacing:.14em;display:flex;gap:7px;align-items:center;margin-bottom:12px}
.panel.blue h3{color:var(--blue)} .panel.green h3{color:#059669} .panel.purple h3{color:#7c3aed}
.panel.amber h3{color:#b45309} .panel.rose h3{color:#e11d48}
.panel.green{background:#f2fdf7;border-color:#bbf0d5}
.panel.amber{background:#fffbeb;border-color:#fde9b8}
.panel.purple{background:#faf8ff;border-color:#e4d8fb}
.panel.blue{background:#f6faff;border-color:#cfe3fb}

/* router row */
.rowtop{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-top:16px}
.agent{border:2px solid #f5c445;background:#fff8e1;border-radius:16px;padding:12px 16px;text-align:center;min-width:180px}
.agent .em{font-size:26px}
.agent .t{font-weight:900;font-size:14px;margin-top:4px}
.agent .s{font-size:11px;color:#9a7b1a;font-weight:700;margin-top:2px}
.start{border:2px solid #6ee7b7;background:#ecfdf5;border-radius:16px;padding:12px 16px;text-align:center}
.start .t{font-weight:900;font-size:13px;color:#065f46}
.start .s{font-size:11px;color:#047857;margin-top:3px;font-weight:700}
.note{border:1.5px solid #fde9b8;background:#fffbeb;border-radius:16px;padding:12px 14px;max-width:250px}
.note .t{font-size:12.5px;font-weight:800;color:#92400e}
.note .s{font-size:11.5px;color:#a16207;margin-top:4px;line-height:1.5}
.dash{flex:1;border-top:2px dashed #cbd7ef;margin-top:26px}

/* ── flow nodes ── */
.flow{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:center}
.node{background:#fff;border:1.5px solid #dbe4f6;border-radius:14px;padding:10px 12px 9px;text-align:center;
  min-width:104px;box-shadow:0 2px 6px rgba(30,58,138,.05);position:relative}
.node .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;margin:0 auto 6px}
.node .nn{font-size:12.5px;font-weight:800;line-height:1.25}
.node .ns{font-size:10px;font-weight:800;color:#b6c0d8;letter-spacing:.12em;margin-top:3px}
.arr{color:#93b4f5;font-size:17px;font-weight:900;padding:0 2px;flex:0 0 auto}
.c1{background:#dbeafe}.c2{background:#ede9fe}.c3{background:#d1fae5}.c4{background:#fef3c7}
.c5{background:#ffe4e6}.c6{background:#cffafe}.c7{background:#fef9c3}.c8{background:#f3e8ff}

/* platform chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:800}
.chip .ci{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}

/* value banner */
.value{margin-top:16px;background:linear-gradient(90deg,#e3edff,#efe9ff);border-radius:999px;
  padding:14px 26px;display:flex;gap:14px;align-items:center}
.value .vi{font-size:22px}
.value .vt{font-size:clamp(15px,1.8vw,20px);font-weight:900;color:var(--navy)}
.value .vs{font-size:12px;color:var(--dim);font-weight:700;margin-top:2px}

/* staff grid */
.staffgrid{display:flex;flex-wrap:wrap;gap:8px}
.staff{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;background:#fff;display:flex;gap:7px;align-items:center}
.staff i{font-style:normal;font-size:14px}
.dept{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dept .dp{border-radius:16px;border:1.5px solid var(--line);padding:12px 14px}
.dp .dn{font-weight:900;font-size:13px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center}
.dp .dn span{font-size:11px;color:#fff;border-radius:999px;padding:2px 10px;font-weight:900}

/* CTA */
.cta{margin-top:26px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:999px;
  padding:22px 34px;text-align:center;color:#fff;font-size:clamp(22px,3.4vw,36px);font-weight:900}
.cta .em{margin-right:12px}

/* nav */
#nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:8px 14px;z-index:5;box-shadow:0 6px 24px rgba(30,58,138,.12)}
#nav button{border:0;background:#eef2fb;border-radius:999px;padding:7px 16px;font-weight:800;cursor:pointer;color:var(--navy)}
#nav .ct{font-size:12.5px;font-weight:800;color:var(--dim);min-width:52px;text-align:center}
#bar{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);z-index:6;transition:width .3s}
.kbd{font-size:11px;color:var(--dim);font-weight:700}

@media (max-width:860px){
  #page{padding:22px 18px}.rowtop{grid-template-columns:1fr}.note{max-width:none}
  .dept{grid-template-columns:1fr}
}
</style>
</head>

let page = 0;
function render(){
  const p = PAGES[page];
  document.getElementById("page").innerHTML =
    p.cover ? coverHTML() : p.cta ? ctaHTML() : boardHTML(p.board);
  document.getElementById("ct").textContent = (page+1)+" / "+PAGES.length;
  document.getElementById("bar").style.width = ((page+1)/PAGES.length*100)+"%";
  document.getElementById("page").scrollTop = 0;
}
function go(d){
  const n = page+d;
  if(n<0||n>=PAGES.length) return;
  page=n; render();
}
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(e.key)){e.preventDefault();go(1);}
  if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){e.preventDefault();go(-1);}
});
document.getElementById("page").addEventListener("click",e=>{ if(e.target.closest("a"))return; go(1); });
render();
</script>
