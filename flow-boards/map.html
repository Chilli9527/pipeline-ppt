<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 流水線 · 一人公司軍團地圖</title>
<style>
:root{
  --navy:#1e2a5a; --ink:#25314f; --dim:#7c86a6;
  --blue:#3b82f6; --purple:#8b5cf6; --green:#10b981; --amber:#f59e0b; --rose:#f43f5e; --cyan:#06b6d4; --slate:#64748b;
  --card:#ffffff; --line:#e3e9f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1000px 800px at 3% -8%, rgba(59,130,246,.15), transparent 60%),
    radial-gradient(1100px 900px at 104% 2%, rgba(139,92,246,.13), transparent 60%),
    radial-gradient(1000px 800px at -4% 110%, rgba(16,185,129,.13), transparent 60%),
    radial-gradient(900px 800px at 102% 108%, rgba(245,158,11,.11), transparent 60%),
    linear-gradient(150deg,#eef4ff 0%,#f6f5ff 48%,#f2fbf7 100%);
}
#viewport{position:absolute;inset:0;cursor:grab;overflow:hidden}
#viewport.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;transform-origin:0 0;padding:56px 70px 90px;width:1560px;display:flex;flex-direction:column;gap:30px}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:900;letter-spacing:.22em;color:#fff;
  background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:999px;padding:8px 22px}
h1{font-size:52px;font-weight:900;line-height:1.1;margin-top:14px;color:var(--navy);letter-spacing:-.01em}
h1 .b{color:var(--blue)}h1 .p{color:var(--purple)}h1 .g{color:var(--green)}
.sub{margin-top:12px;display:flex;gap:18px;font-size:19px;font-weight:800;color:#4a5680}
.sub i{font-style:normal;display:inline-flex;align-items:center;gap:8px}
.sub .d{width:11px;height:11px;border-radius:50%}
.nc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 24px;text-align:center;
  box-shadow:0 8px 22px rgba(30,58,138,.08)}
.nc b{display:block;font-size:44px;font-weight:900;line-height:1}
.nc i{font-style:normal;font-size:15px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.c1 b{color:var(--navy)}.c2 b{color:var(--rose)}.c3 b{color:var(--green)}

/* root row */
.root{display:flex;align-items:stretch;gap:16px}
.rootbox{flex:1;border:3px solid #c7d2fe;background:#eef2ff;border-radius:20px;padding:16px 24px;display:flex;align-items:center;gap:16px}
.rootbox .em{font-size:40px}
.rootbox .t{font-size:24px;font-weight:900;color:#3730a3}
.rootbox .s{font-size:15px;color:#6366f1;font-weight:700;margin-top:2px}
.router{flex:1.1;border:3px solid #f5c445;background:#fff8e1;border-radius:20px;padding:14px 20px;display:flex;align-items:center;gap:14px}
.router .em{font-size:36px}
.router .t{font-size:21px;font-weight:900;color:#92400e}
.router .s{font-size:15px;color:#a16207;font-weight:700}

/* staff band */
.staffband{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 22px;box-shadow:0 6px 18px rgba(30,58,138,.05)}
.sb-head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900;letter-spacing:.12em;color:#334155;margin-bottom:10px}
.staffrow{display:flex;flex-wrap:wrap;gap:8px}
.sc{display:inline-flex;align-items:center;gap:7px;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:5px 13px;font-size:14.5px;font-weight:800;color:#37415f}
.sc .d{width:9px;height:9px;border-radius:50%}
.sc .ie{font-size:16px}

/* departments + lanes */
.depts{display:flex;flex-direction:column;gap:18px}
.dept-block{border:2px solid var(--line);background:rgba(255,255,255,.72);border-radius:20px;padding:14px 18px 16px;
  box-shadow:0 8px 24px rgba(30,58,138,.05)}
.db-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dept{font-size:14px;font-weight:900;letter-spacing:.14em;color:#fff;border-radius:9px;padding:4px 12px}
.db-name{font-size:20px;font-weight:900;color:var(--navy)}
.db-count{margin-left:auto;font-size:14px;font-weight:800;color:var(--dim)}
.lanes{display:flex;flex-direction:column;gap:10px}
.lane{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.lane-head{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;user-select:none}
.lane-head:hover{background:#f8faff}
.tri{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#fff;flex:0 0 auto;transition:transform .2s}
.lane.closed .tri{transform:rotate(-90deg)}
.lname{font-size:20px;font-weight:900;color:var(--navy)}
.lagent{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#fffbeb;border:2px solid #fde9b8;
  border-radius:999px;padding:4px 13px;font-size:14px;font-weight:800;color:#b45309}
.lane-steps{display:none;padding:2px 14px 12px 52px}
.lane.open .lane-steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.node{background:#fff;border:2px solid #dbe4f6;border-radius:12px;padding:6px 12px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(30,58,138,.04)}
.node .ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:0 0 auto}
.node .nn{font-size:15.5px;font-weight:800;color:#313c5e;white-space:nowrap}
.arr{color:#93b4f5;font-size:17px;font-weight:900}

/* toolbar */
#bar{position:fixed;bottom:52px;right:16px;display:flex;gap:8px;align-items:center;background:var(--card);
  border:2px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 8px 24px rgba(30,58,138,.12);z-index:10}
#bar button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-size:15px;font-weight:900;
  color:var(--navy);cursor:pointer}
#bar button:hover{border-color:#93b4f5;background:#f4f8ff}
#bar button.on{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;border-color:transparent}
#zoom{font-weight:900;color:var(--navy);font-size:15px;min-width:56px;text-align:center}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:#8a94b5;
  background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:999px;padding:6px 18px;z-index:10}
</style>
</head>
<body>
<div id="viewport"><div id="map">

  <div class="head">
    <div>
      <span class="kicker">🦁 AI LION · ONE-PERSON COMPANY MAP</span>
      <h1>AI <span class="b">流水線</span> · <span class="p">一人公司軍團</span> · 地圖</h1>
      <div class="sub">
        <i><span class="d" style="background:var(--blue)"></span>起線</i>
        <i><span class="d" style="background:var(--purple)"></span>驗收</i>
        <i><span class="d" style="background:var(--green)"></span>出街</i>
        <i><span class="d" style="background:var(--amber)"></span>維護</i>
        <i><span class="d" style="background:var(--rose)"></span>回報</i>
      </div>
    </div>
    <div style="display:flex;gap:14px">
      <div class="nc c1"><b>3</b><i>AI AGENTS</i></div>
      <div class="nc c2"><b>8</b><i>條 AI 流水線</i></div>
      <div class="nc c3"><b>17</b><i>個 AI 員工</i></div>
    </div>
  </div>

  <div class="root">
    <div class="rootbox"><span class="em">🧠</span><div><div class="t">你的第二大腦</div><div class="s">對話 · 決策 · 客戶資料，全部沉澱喺同一個腦</div></div></div>
    <div class="router"><span class="em">🧑‍💼</span><div><div class="t">你 · 調度者</div><div class="s">派任務 · 收結果 · 統一審核</div></div><span class="em" style="font-size:26px;color:#d97706">➜</span><div><div class="t">👑 阿強 · CEO Agent</div><div class="s">3 Agents 調度 17 個 AI 員工</div></div></div>
  </div>

  <div class="staffband">
    <div class="sb-head">🦁 17 個 AI 員工 · 四個部門</div>
    <div class="staffrow" id="staff"></div>
  </div>

  <div class="depts" id="depts"></div>

</div></div>

<div id="bar">
  <button id="expand">全部展開</button>
  <button id="collapse">全部收起</button>
  <button id="zoomout">−</button>
  <span id="zoom">100%</span>
  <button id="zoomin">＋</button>
  <button id="fit" class="on">成張睇</button>
</div>
<div class="hint">拖曳移動 · 滾輪縮放 · 撳線名展開／收起</div>

<script>
const D={blue:["#dbeafe","#2563eb"],purple:["#ede9fe","#7c3aed"],green:["#d1fae5","#059669"],amber:["#fef3c7","#b45309"],rose:["#ffe4e6","#e11d48"],cyan:["#cffafe","#0891b2"],slate:["#e2e8f0","#475569"]};
const dk=Object.keys(D);

const STAFF=[
 ["👑","阿強 · CEO","#1e2a5a"],["P","金水 · PPT","#3b82f6"],["✂️","阿梅 · 剪片","#3b82f6"],["🎙️","秋香姐 · 口播","#3b82f6"],
 ["🧧","斷水流師兄 · CNY片","#3b82f6"],["✍️","石榴姐 · 文案","#3b82f6"],["📤","奔雷手文泰 · 發布","#3b82f6"],
 ["🦁","阿漆 · AI Lion","#8b5cf6"],["⚡","西門吹雪 · Shorts","#8b5cf6"],["🗣️","黃金右腳 · 普通話","#8b5cf6"],["🦈","醬爆 · AI Shark","#8b5cf6"],
 ["📧","金槍人 · Email","#10b981"],["🎪","三叔 · GoMan","#10b981"],
 ["🧱","阿成 · Zo","#f59e0b"],["🏠","包租公 · 介面","#f59e0b"],["🔦","太陽能電筒 · Grill","#f59e0b"],["🔧","火雞姐 · 技術","#f59e0b"],
];
document.getElementById('staff').innerHTML=STAFF.map(([ie,n,c])=>
 `<span class="sc"><span class="ie">${ie}</span><span class="d" style="background:${c}"></span>${n}</span>`).join('');

const DEPTS=[
 {name:"市場部 · MARKETING",color:"#3b82f6",lanes:[
  {name:"一條片出齊所有平台",agent:"📤 奔雷手文泰 · 發布",steps:"拍一條片|轉內文|抽圖|改文案|切換版本|發五平台|發 WhatsApp|上網站 Blog"},
  {name:"素材變內容",agent:"✍️ 石榴姐 · 文案",steps:"收料|搵爆款|學你風格|改寫|寫文案|起標題|出圖|發社交媒體"},
  {name:"每日自動搵料",agent:"🔍 金水 · PPT／搵料",steps:"掃熱話|揀題目|搵素材|想標題|寫內文|出圖|審批|排程發佈"},
  {name:"活動流水線",agent:"🎪 三叔 · GoMan",steps:"開活動|出報名頁|寫文案|FB 廣告|Email 群發|群組通知|確認信|加日曆|提醒信|存檔覆盤"},
  {name:"營運 YouTube Channel",agent:"🦁 阿漆 · AI Lion 總管",steps:"定題|寫稿|配音|出圖|出動畫|配樂＋字幕|剪接|上載"},
 ]},
 {name:"銷售部 · SALES",color:"#10b981",lanes:[
  {name:"AI 客戶開發",agent:"📧 金槍人 · Email 流水線",steps:"抓名單|AI 判斷|做兩個 Demo|寫 Email Script|審核|發送同追蹤|每日報告"},
 ]},
 {name:"會計部 · ACCOUNTING",color:"#f59e0b",lanes:[
  {name:"會計記帳 · 收支報表",agent:"📊 金算盤 · 記帳",steps:"收票據|分類|入帳|對數|出收支表|月結報告"},
 ]},
 {name:"技術部 · IT",color:"#f43f5e",lanes:[
  {name:"網站功能 · 建系統",agent:"🧱 阿成 · Zo",steps:"會員系統|自動收款|點數|AI 出圖|內容中樞|錄音變文字|紀錄中心|一鍵發佈|活動報名|預約系統|技能模板|推薦分佣"},
  {name:"取代付費工具",agent:"🔧 火雞姐 · 技術",steps:"列清單|計用量|揀替代|AI 重寫|匯出資料|備份|試行|取消訂閱"},
 ]},
];
document.getElementById('depts').innerHTML=DEPTS.map(dp=>{
 const lanes=dp.lanes.map((L,i)=>{
  const steps=L.steps.split('|');
  const nodes=steps.map((s,j)=>{
    const c=D[dk[(i+j)%dk.length]];
    return `<span class="node"><span class="ic" style="background:${c[0]};color:${c[1]}">${String(j+1).padStart(2,'0')}</span><span class="nn">${s}</span></span>${j<steps.length-1?'<span class="arr">➜</span>':''}`;
  }).join('');
  return `<div class="lane open"><div class="lane-head"><span class="tri" style="background:${dp.color}">▼</span><span class="lname">${L.name}</span><span class="lagent">${L.agent}</span></div><div class="lane-steps">${nodes}</div></div>`;
 }).join('');
 return `<div class="dept-block"><div class="db-head"><span class="dept" style="background:${dp.color}">${dp.name.split(' · ')[1]}</span><span class="db-name">${dp.name.split(' · ')[0]}</span><span class="db-count">${dp.lanes.length} 條線</span></div><div class="lanes">${lanes}</div></div>`;
}).join('');

document.querySelectorAll('.lane-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('closed'));

/* zoom + pan */
const vp=document.getElementById('viewport'),map=document.getElementById('map');
let scale=1,tx=0,ty=0,drag=null;
const zoomEl=document.getElementById('zoom');
function apply(){map.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;zoomEl.textContent=Math.round(scale*100)+'%';
  document.getElementById('fit').classList.toggle('on',false);}
function fit(){
  const mw=map.scrollWidth+140,mh=map.scrollHeight+160;
  scale=Math.min(vp.clientWidth/mw,vp.clientHeight/mh,1);
  tx=(vp.clientWidth-map.scrollWidth*scale)/2;
  ty=Math.max(10,(vp.clientHeight-map.scrollHeight*scale)/2);
  apply();document.getElementById('fit').classList.add('on');
}
function zoom(f,cx,cy){
  const ns=Math.min(2.5,Math.max(.2,scale*f));
  cx=cx??vp.clientWidth/2;cy=cy??vp.clientHeight/2;
  tx=cx-((cx-tx)/scale)*ns;ty=cy-((cy-ty)/scale)*ns;scale=ns;apply();
}
document.getElementById('zoomin').onclick=()=>zoom(1.25);
document.getElementById('zoomout').onclick=()=>zoom(.8);
document.getElementById('fit').onclick=fit;
document.getElementById('expand').onclick=()=>document.querySelectorAll('.lane').forEach(l=>{l.classList.remove('closed');l.classList.add('open')});
document.getElementById('collapse').onclick=()=>document.querySelectorAll('.lane').forEach(l=>{l.classList.remove('open');l.classList.add('closed')});
vp.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.lane-head'))return;drag={x:e.clientX,y:e.clientY,tx,ty};vp.classList.add('drag')});
addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply()});
addEventListener('pointerup',()=>{drag=null;vp.classList.remove('drag')});
addEventListener('resize',fit);
fit();
</script>
</body>
</html>
