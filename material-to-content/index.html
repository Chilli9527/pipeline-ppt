  transform-origin:0 0;background:#060A14}

/* ── 背景 ── */
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;will-change:transform;
  animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(calc(var(--x)*-1),calc(var(--y)*-1),0)}
  to{transform:translate3d(var(--x),var(--y),0)}}
.dots{position:absolute;inset:-40px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1.8px,transparent 1.8px);
  background-size:64px 64px}
.vig{position:absolute;inset:0;background:radial-gradient(115% 90% at 50% 46%,
  transparent 36%,rgba(0,0,0,.66) 100%)}

/* ── 頂部小標 ── */
.kick{position:absolute;left:0;right:0;top:48px;display:flex;justify-content:center;
  align-items:center;gap:18px;font-size:24px;font-weight:900;letter-spacing:.42em;
  color:rgba(255,138,80,.92);transition:opacity .5s ease}
.kick i{display:block;width:52px;height:1px;background:rgba(255,138,80,.42)}
.kick .ytlogo{width:46px;height:33px;flex-shrink:0}
.merged .kick{opacity:0}

/* ── 開場大標題 ── */
.lead{position:absolute;left:0;right:0;top:92px;text-align:center;
  font-size:54px;font-weight:900;letter-spacing:.01em;color:var(--ink);
  text-shadow:0 6px 34px rgba(0,0,0,.65);
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.lead i{font-style:normal;color:var(--gold)}
.started .lead{opacity:0;transform:translateY(-14px)}

/* ── 七張浮動卡 ── */
.card{position:absolute;width:330px;height:210px;border-radius:24px;
  background:linear-gradient(180deg,rgba(16,26,44,.94),rgba(7,11,20,.94));
  border:1.5px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  opacity:.22;
  transition:opacity .55s ease,border-color .5s ease,box-shadow .6s ease,
    transform .85s cubic-bezier(.45,.05,.2,1);
  will-change:transform;z-index:2}
.card.on{opacity:1}
.card .float{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  animation:bob var(--bd) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-7px) rotate(var(--tilt))}
  to{transform:translateY(7px) rotate(calc(var(--tilt) * -1))}}

.card .tag{position:absolute;top:18px;left:22px;font-family:var(--num);
  font-size:15px;font-weight:900;letter-spacing:.26em;color:var(--c);
  opacity:.35;transition:opacity .45s ease}
.card.on .tag{opacity:1}

.coin{position:relative;width:92px;height:92px;border-radius:50%;
  background:#0C1424;border:1.5px solid rgba(255,255,255,.10);
  display:grid;place-items:center;transition:border-color .5s,box-shadow .6s}
.card.on .coin{border-color:color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 0 34px color-mix(in srgb,var(--c) 30%,transparent)}
.coin svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.coin svg.ring circle{fill:none;stroke:var(--c);stroke-width:2.8;
  stroke-dasharray:270;stroke-dashoffset:270;stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.2,1) .06s}
.card.on .coin svg.ring circle{stroke-dashoffset:0}
.coin .ic{color:var(--c);opacity:.18;transition:opacity .45s ease .14s}
.card.on .coin .ic{opacity:1}

.name{font-size:30px;font-weight:900;letter-spacing:.01em;color:#5E7085;
  transition:color .45s ease,text-shadow .45s ease;white-space:nowrap}
.card.on .name{color:var(--ink);text-shadow:0 4px 24px rgba(0,0,0,.7)}

/* 匯聚 */
.card.mv{transition:transform .85s cubic-bezier(.45,.05,.2,1),
  opacity .3s ease .62s,border-color .4s,box-shadow .4s;opacity:0}

/* ── 串成嘅流水線 ── */
.pipe{position:absolute;left:40px;top:330px;width:1840px;height:320px;
  border-radius:160px;opacity:0;transform:scale(.96);
  background:linear-gradient(100deg,rgba(44,76,122,.55),rgba(255,138,80,.10));
  border:1.5px solid rgba(90,130,180,.40);overflow:hidden;
  box-shadow:0 0 90px rgba(40,80,140,.26),inset 0 0 60px rgba(255,138,80,.06);
  transition:opacity .6s ease .75s,transform .8s cubic-bezier(.2,.8,.2,1) .75s;
  z-index:1}
.merged .pipe{opacity:1;transform:none}
.pipe::before{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.12) 50%,transparent 80%);
  transform:translateX(-100%)}
.merged .pipe::before{animation:sweep 4.6s cubic-bezier(.4,0,.2,1) 1.9s infinite}
@keyframes sweep{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}

.mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mini .rail{position:absolute;z-index:1;left:260px;top:159px;width:1320px;height:2.5px;
  border-radius:2px;background:linear-gradient(90deg,#2C4C7A,#FF8A50);opacity:.6;
  box-shadow:0 0 18px rgba(90,130,180,.30)}
.mini .m{position:relative;z-index:2;width:200px;display:flex;flex-direction:column;
  align-items:center;gap:9px;opacity:0;transition:opacity .45s ease}
.merged .mini .m{opacity:1}
.mini .dot{width:134px;height:134px;border-radius:50%;display:grid;place-items:center;
  background:#0A1220;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);
  color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 22%,transparent)}
.mini .dot svg{width:56px;height:56px}
.mini span{font-size:26px;font-weight:900;color:rgba(237,242,248,.9);white-space:nowrap}

/* ── 收尾大字 ── */
.cap{position:absolute;left:0;right:0;top:712px;text-align:center;opacity:0;
  transform:translateY(18px);
  transition:opacity .7s ease 1.55s,transform .8s cubic-bezier(.2,.8,.2,1) 1.55s}
.merged .cap{opacity:1;transform:none}
.cap b{display:block;font-size:64px;font-weight:900;color:var(--ink)}
.cap b i{font-style:normal;color:var(--gold)}
.cap em{display:block;margin-top:22px;font-style:normal;font-size:32px;
  color:rgba(237,242,248,.55);letter-spacing:.06em}

/* ── 底部提示 ── */
.foot{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;
  gap:44px;align-items:center;font-size:26px;color:rgba(237,242,248,.5);
  transition:opacity .4s ease}
.foot b{font-family:var(--num);font-size:28px;color:var(--gold);letter-spacing:.06em}
.foot kbd{font-family:var(--num);background:rgba(255,255,255,.1);border-radius:8px;
  padding:3px 12px;font-size:23px;color:rgba(255,255,255,.8)}
.merged .foot{opacity:0}

#hud{position:fixed;right:18px;bottom:14px;z-index:20;display:flex;gap:16px;
  font-family:var(--num);font-size:13px;letter-spacing:.1em;
  color:rgba(237,242,248,.32);user-select:none}
body.nohud #hud{display:none}

#help{position:fixed;inset:0;z-index:30;background:rgba(5,8,16,.96);display:none;
  place-items:center;color:var(--ink)}
#help.on{display:grid}
#help .card2{background:rgba(255,255,255,.05);border:1px solid rgba(255,138,80,.28);
  border-radius:22px;padding:34px 44px;min-width:520px;font-size:19px}
#help h3{margin:0 0 18px;color:var(--gold);font-size:22px;letter-spacing:.1em}
#help td{padding:8px 0;color:var(--soft)}
#help td:first-child{padding-right:40px;color:var(--amber);font-family:var(--num)}

/* ── 置頂：返回總目錄 ── */
#homeLink{position:fixed;left:16px;top:16px;z-index:60;
  font-family:"PingFang HK","Heiti TC",sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.1em;color:rgba(255,255,255,.78);text-decoration:none;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:9px 15px;backdrop-filter:blur(8px);
  transition:background .25s,color .25s,opacity .25s}
#homeLink:hover{background:rgba(0,0,0,.72);color:#fff}
body.nohud #homeLink{opacity:0;pointer-events:none}

/* ── 素材／平台板 ── */
#proof{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 34%,#0A1220,#03060C 76%);
  transition:opacity .55s ease;display:flex;flex-direction:column;align-items:center;justify-content:center}
.proofon #proof{opacity:1}
#proof h2{margin:0;font-size:66px;font-weight:900;color:var(--ink);letter-spacing:.01em}
#proof h2 i{font-style:normal;color:var(--gold)}
#proof .sub{margin:8px 0 0;font-size:26px;color:rgba(237,242,248,.55);letter-spacing:.03em}
.rowlbl{margin-top:34px;font-size:15px;font-weight:900;letter-spacing:.34em;color:rgba(237,242,248,.32)}
.chips{display:flex;gap:18px;margin-top:14px}
.chip{width:186px;display:flex;flex-direction:column;align-items:center;gap:10px}
.chip .ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.10)}
.chip .ic svg{width:46px;height:46px}
.chip span{font-size:18px;font-weight:900;color:rgba(237,242,248,.86);white-space:nowrap}
.band{position:relative;width:1520px;height:2px;margin:26px 0;
  background:linear-gradient(90deg,transparent,rgba(255,138,80,.55),transparent)}
.band em{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:7px 20px;border-radius:999px;background:#0B1220;border:1px solid rgba(255,138,80,.45);
  font-style:normal;font-size:16px;font-weight:900;letter-spacing:.16em;color:#FF8A50;white-space:nowrap}
#proof .note{margin-top:30px;font-size:22px;color:rgba(237,242,248,.5);letter-spacing:.03em}

#proof{justify-content:flex-start;padding-top:88px}

#core.on{transform:scale(1);opacity:1}
#core .soc{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);opacity:0;transform:scale(.4);
  transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1)}
#core .soc.on{opacity:1;transform:scale(1)}
#core .soc svg{width:52px;height:52px}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:12px;opacity:0;z-index:3}
.node .ic{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.13)}
.node .ic svg{width:68px;height:68px}
.node span{font-size:23px;font-weight:900;color:rgba(237,242,248,.88);white-space:nowrap}
.node.in{animation:attn2 .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes attn2{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
 58%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#fx{z-index:1}
#fx path{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.85}
#proof .note{z-index:4}
/* ── 舊樣式（已停用） ── */
#fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
#fx path{fill:none;stroke:#FF8A50;stroke-width:3;stroke-linecap:round;opacity:.75}
#proof .rowlbl,#proof .chips,#proof .band,#proof .note,#proof h2,#proof .sub{position:relative;z-index:2}
.chip{will-change:transform,opacity}
.chip.in{animation:attn .52s cubic-bezier(.2,.8,.3,1) both}
@keyframes attn{
  0%{transform:scale(.35);opacity:0}
  55%{transform:scale(1.16);opacity:1}
  75%{transform:scale(.94)}
  88%{transform:scale(1.04)}
  100%{transform:scale(1)}
}
.chip.swallow{position:relative;z-index:3}
#hitc{position:relative;z-index:4;margin-top:16px;display:inline-flex;align-items:baseline;gap:8px;
  font-family:var(--num);font-size:17px;font-weight:900;letter-spacing:.06em;
  color:rgba(237,242,248,.55)}
#hitc b{font-size:30px;color:#FF8A50;letter-spacing:0}
#hitc.pop b{animation:punch .38s cubic-bezier(.2,.9,.3,1)}
@keyframes punch{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}
#hitc b{display:inline-block;transform-origin:50% 70%}
.impact{position:absolute;z-index:5;width:0;height:0;border-radius:50%;
  box-shadow:0 0 0 0 rgba(255,138,80,.85);pointer-events:none}
.impact.go{animation:ringx .55s ease-out forwards}
@keyframes ringx{0%{box-shadow:0 0 0 0 rgba(255,138,80,.85)}100%{box-shadow:0 0 0 46px rgba(255,138,80,0)}}
#proof > .note{position:absolute;left:0;right:0;bottom:40px;margin:0;text-align:center;z-index:5}

</style>

/* ══════════ 音效：突突聲 ══════════ */
let ac = null, out = null, muted = false;
function audio(){
  try {
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination);
      if (muted) out.gain.value = 0;
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tick(o = {}){
  if (!ac || muted) return;
  const {delay = 0, gain = .26, f = 240} = o;
  const t = ac.currentTime + delay;
  const len = Math.floor(ac.sampleRate * 0.05);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){ const e = 1 - i/len; d[i] = (Math.random()*2-1) * e * e; }
  const src = ac.createBufferSource(); src.buffer = buf;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(hp); hp.connect(g); g.connect(out);
  src.start(t); src.stop(t + .06);
  const osc = ac.createOscillator(), g2 = ac.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(f * 2.1, t);
  osc.frequency.exponentialRampToValueAtTime(f * .65, t + .06);
  g2.gain.setValueAtTime(.0001, t);
  g2.gain.exponentialRampToValueAtTime(gain * .55, t + .008);
  g2.gain.exponentialRampToValueAtTime(.0001, t + .07);
  osc.connect(g2); g2.connect(out); osc.start(t); osc.stop(t + .09);
}
function boom(t, gain = .34){
  if (!ac || muted) return;
  const tt = ac.currentTime + t;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(112, tt);
  osc.frequency.exponentialRampToValueAtTime(36, tt + .6);
  g.gain.setValueAtTime(.0001, tt);
  g.gain.exponentialRampToValueAtTime(gain, tt + .02);
  g.gain.exponentialRampToValueAtTime(.0001, tt + .62);
  osc.connect(g); g.connect(out); osc.start(tt); osc.stop(tt + .65);
}
function sfxStep(i){
  if (!ac || muted) return;
  tick({delay: 0,    gain: .30, f: 200 + i * 12});
  tick({delay: .062, gain: .17, f: 268 + i * 12});
}
function sfxChain(){
  if (!ac || muted) return;
  [0, .07, .13, .175, .215, .248, .276, .30]
    .forEach((dl, k) => tick({delay: dl, gain: .24, f: 170 + k * 16}));
  boom(.34);
}

  document.getElementById("pageState").textContent = proofOpen ? "素材／平台" : merged ? "串成一條" : `${revealed} / ${STEPS.length} 步`;
}
function hint(){
  counter.innerHTML = `第 <b>${revealed}</b> / ${STEPS.length} 步`;
  hintTxt.innerHTML = revealed === 0 ? '撳一下 <kbd>空白</kbd> → 出一步'
    : revealed < STEPS.length ? '撳一下 <kbd>空白</kbd> → 出下一步'
    : merged ? (proofOpen ? '撳一下 → <b>下一條流水線</b>（<kbd>←</kbd> 返）' : '撳一下 → <b>睇素材／平台</b>')
    : '撳一下 → <b>串成一條流水線</b>';
  hud();
}

function layoutRail(){

  const k = mr.width / 1840;
  if (!k) return;
  const a = dots[0].getBoundingClientRect();
  const b = dots[dots.length - 1].getBoundingClientRect();
  const cx1 = (a.left - mr.left) / k + a.width / (2 * k);
  const cx2 = (b.left - mr.left) / k + b.width / (2 * k);
  const cy  = (a.top - mr.top) / k + a.height / (2 * k);
  railEl.style.left = cx1.toFixed(1) + "px";
  railEl.style.width = Math.max(0, cx2 - cx1).toFixed(1) + "px";
  railEl.style.top = (cy - 1.25).toFixed(1) + "px";
}

function showCard(i){ cards[i].el.classList.add("on"); }
function hideCard(i){ cards[i].el.classList.remove("on"); }

/* 串連 */
function chain(){
  if (merged) return;
  audio(); sfxChain();
  const barY = 490;                        /* 長條中心（330 + 160） */
  cards.forEach((c, i) => {
    const dx = (260 + i * 200) - c.x;
    const dy = barY - c.y;
    c.el.style.transitionDelay = (i * 0.055).toFixed(3) + "s";
    c.el.classList.add("mv");
    c.el.style.transform =
      `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(.30)`;
  });
  stage.classList.add("merged");
  merged = true;
  layoutRail();
  setTimeout(layoutRail, 700);
  setTimeout(layoutRail, 1600);
  hud();
}
function unchain(){
  if (!merged) return;
  stage.classList.remove("merged");
  cards.forEach((c) => {
    c.el.classList.remove("mv");
    c.el.style.transitionDelay = "0s";
    c.el.style.transform = "";
  });
  merged = false;
  hud();
}


/* ── 操作 ── */
let proofOpen = false;
function openProof(){ if (!merged) return; proofOpen = true;
  document.getElementById("stage").classList.add("proofon"); hud(); hint();
  setTimeout(playProof, 260); }

function playProof(){
  const proof = document.getElementById("proof");
  if (!proof) return;
  const svg   = document.getElementById("fx");
  const core  = document.getElementById("core");
  const files = [...proof.querySelectorAll(".node.file")];
  const socs  = [...proof.querySelectorAll("#core .soc")];
  const st    = document.getElementById("stage").getBoundingClientRect();
  const k     = st.width / 1920;
  const CX = 960, CY = 750, RH = 235;

  svg.innerHTML = "";
  core.classList.remove("on");
  socs.forEach(s => s.classList.remove("on"));
  files.forEach(f => { f.getAnimations().forEach(a=>a.cancel()); f.classList.remove("in"); });

  const P = (el) => { const r = el.getBoundingClientRect();
    return { x:(r.left-st.left)/k + r.width/(2*k), y:(r.top-st.top)/k + r.height/(2*k) }; };

  // 1) 七個素材逐個彈出（無閃、無環）
  files.forEach((f,i) => setTimeout(() => f.classList.add("in"), 120 + i*130));

  // 2) Hub 縮放入場
  const hubAt = 120 + files.length*130 + 200;
  setTimeout(() => core.classList.add("on"), hubAt);

  // 3) 七條彩虹光管：素材 → hub 邊
  const tubeAt = hubAt + 420;
  files.forEach((f,i) => {
    setTimeout(() => {
      const c0 = P(f.querySelector(".ic"));
      const dx = CX - c0.x, dy = CY - c0.y;
      const d  = Math.hypot(dx,dy) || 1;
      const s  = { x: c0.x + dx/d*76, y: c0.y + dy/d*76 };
      const ex = CX - dx/d*RH, ey = CY - dy/d*RH;
      const mx = (s.x+ex)/2 + (-dy/d)*46;
      const my = (s.y+ey)/2 + ( dx/d)*46;
      const id = "tube"+i;
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("id", id);
      path.setAttribute("d", "M "+s.x+" "+s.y+" Q "+mx+" "+my+" "+ex+" "+ey);
      path.setAttribute("stroke", "hsl("+(i*46)+" 90% 62%)");
      path.style.opacity = ".8";
      svg.appendChild(path);
      const L = path.getTotalLength();
      path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
      path.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
        {duration:460, fill:"forwards", easing:"cubic-bezier(.4,0,.2,1)"});

      // 脈衝：一粒光沿管流去 hub
      const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
      dot.setAttribute("r","6.5");
      dot.setAttribute("fill","hsl("+(i*46)+" 95% 72%)");
      dot.setAttribute("filter","url(#glow)");
      const mo = document.createElementNS("http://www.w3.org/2000/svg","animateMotion");
      mo.setAttribute("dur","1.5s");
      mo.setAttribute("repeatCount","indefinite");
      mo.setAttribute("begin","0.2s");
      const mp = document.createElementNS("http://www.w3.org/2000/svg","mpath");
      mp.setAttributeNS("http://www.w3.org/1999/xlink","href","#"+id);
      mo.appendChild(mp); dot.appendChild(mo); svg.appendChild(dot);
    }, tubeAt + i*110);
  });

  // 4) 八個平台 icon 最後逐個亮起
  const socAt = tubeAt + files.length*110 + 500;
  socs.forEach((s,i) => setTimeout(() => s.classList.add("on"), socAt + i*90));
}

function closeProof(){ proofOpen = false; document.getElementById("stage").classList.remove("proofon");
  const svg = document.getElementById("fx"); if (svg) svg.innerHTML = "";
  const core = document.getElementById("core"); if (core) core.classList.remove("on");
  document.querySelectorAll("#proof .soc").forEach(s=>s.classList.remove("on"));
  document.querySelectorAll("#proof .node").forEach(n=>{ n.getAnimations().forEach(a=>a.cancel()); n.classList.remove("in"); });
  hud(); hint(); }

function next(){
  audio();
  if (proofOpen){ return goNextDeck(); }
  if (merged){ openProof(); return; }
  if (revealed < STEPS.length){ stage.classList.add("started"); showCard(revealed); revealed++; sfxStep(revealed - 1); hint(); }
  else chain();
}
function goPrevDeck(){
  try{ if (window.self !== window.top){ parent.postMessage({ type:"goto", id:"ai-pipeline-flow-end" }, "*"); return; } }catch(e){}
  location.href = "../ai-pipeline-flow/?at=end";
}
function prev(){
  if (proofOpen) return closeProof();
  if (merged) return unchain();
  if (revealed > 0){ revealed--; hideCard(revealed); hint(); }
  else goPrevDeck();
}
function reset(){
  proofOpen = false; document.getElementById("stage").classList.remove("proofon");
  unchain();
  cards.forEach((c) => { c.el.classList.remove("on","mv"); c.el.style.transform = ""; });
  revealed = 0; stage.classList.remove("started"); hint();
}
function jumpEnd(){
  while (revealed < STEPS.length){ showCard(revealed); revealed++; }
  hint();
  setTimeout(chain, 420);
}
if (location.search.indexOf("at=end") >= 0){
  var _t = 0;
  var _iv = setInterval(function(){
    if (_t++ > 80 || proofOpen){ clearInterval(_iv); return; }
    if (merged){ openProof(); clearInterval(_iv); return; }
    if (revealed < STEPS.length){ document.getElementById("stage").classList.add("started"); showCard(revealed); revealed++; return; }
    chain();
  }, 45);
}
function replay(){ if (merged){ unchain(); setTimeout(chain, 320); } }

stage.addEventListener("click", next);
/* ── 撳到最後一下 → 去下一條流水線 ── */
const NEXT_DECK = "replace-paid-tools";
function goNextDeck(){
  try {
    if (window.self !== window.top){ parent.location.hash = "#" + NEXT_DECK; return; }
  } catch (e) {}
  location.href = "../" + NEXT_DECK + "/";
}

addEventListener("keydown", (e) => {
  const k = e.key;
  if ([" ","ArrowRight","ArrowDown","PageDown","Enter"].includes(k)){ e.preventDefault(); next(); }
  else if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){ e.preventDefault(); prev(); }
  else if (k === "Home") reset();
  else if (k === "End") jumpEnd();
  else if (k === "m" || k === "M"){ muted = !muted; if (out) out.gain.value = muted ? 0 : .55; hud(); }
  else if (k === "r" || k === "R") replay();
  else if (k === "f" || k === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === "h" || k === "H") document.body.classList.toggle("nohud");
  else if (k === "?" || k === "/") document.getElementById("help").classList.toggle("on");
  else if (k === "Escape") document.getElementById("help").classList.remove("on");
});
document.getElementById("help").addEventListener("click", (e) => {
  if (e.target.id === "help") e.currentTarget.classList.remove("on");
});

/* ── 縮放：任何窗口都完整顯示 ── */
function fit(){
  const vv = window.visualViewport;
  const w = Math.max(1, Math.floor(vv ? vv.width : innerWidth));
  const h = Math.max(1, Math.floor(vv ? vv.height : innerHeight));
  const s = Math.min(w / 1920, h / 1080);
  stage.style.transform =
    `translate(${Math.round((w - 1920*s)/2)}px,${Math.round((h - 1080*s)/2)}px) scale(${s})`;
  requestAnimationFrame(layoutRail);
}
let q = false;
const queueFit = () => { if (q) return; q = true; requestAnimationFrame(() => { q = false; fit(); }); };
addEventListener("resize", queueFit);
addEventListener("orientationchange", queueFit);
if (window.visualViewport){
  visualViewport.addEventListener("resize", queueFit);
  visualViewport.addEventListener("scroll", queueFit);
}
if (window.ResizeObserver) new ResizeObserver(queueFit).observe(document.documentElement);
document.addEventListener("fullscreenchange", queueFit);
fit();
hint();
</script>
<script>
/* gesture bridge：向下撳／向下滑＝下一版，向上撳／向上滑＝上一版 */
(function(){
  if (window.__gestureBridge) return;
  window.__gestureBridge = true;
  var lock = 0, swallow = false;
  function fire(key){
    window.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
  }
  var lockDir = { up: 0, down: 0 };
  window.addEventListener("wheel", function(e){
    if (Math.abs(e.deltaY) < 22) return;
    var dir = e.deltaY > 0 ? "down" : "up", now = Date.now();
    if (now - lockDir[dir] < 620) return;
    lockDir[dir] = now;
    fire(dir === "down" ? "ArrowRight" : "ArrowLeft");
  }, { passive: true });
  var ty = 0, tx = 0;
  window.addEventListener("touchstart", function(e){
    var t = e.touches[0]; ty = t.clientY; tx = t.clientX;
  }, { passive: true });
  window.addEventListener("touchend", function(e){
    var t = e.changedTouches[0], dy = t.clientY - ty, dx = t.clientX - tx;
    if (Math.abs(dy) < 54 || Math.abs(dy) < Math.abs(dx)) return;
    swallow = true;
    setTimeout(function(){ swallow = false; }, 420);
    fire(dy < 0 ? "ArrowLeft" : "ArrowRight");
  }, { passive: true });
  window.addEventListener("click", function(e){
    if (swallow){ e.stopPropagation(); e.preventDefault(); swallow = false; }
  }, true);
})();
</script>
<script>
if (!window.__escBridge){ window.__escBridge = true;
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ try{ parent.postMessage({ type:"escape" }, "*"); }catch(err){} }
  });
}
</script>
