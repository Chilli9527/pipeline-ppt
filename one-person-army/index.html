#pageB .bpre{font-size:56px;letter-spacing:.30em;font-weight:900;color:#8C7B70}
#pageB .bmain{font-size:176px;font-weight:900;line-height:1.05;color:#16130F;letter-spacing:.01em}
#pageB .bmain i{font-style:normal;color:#B4552F}
#pageB .brule{width:260px;height:6px;border-radius:3px;background:#B4552F;margin:26px 0 10px}
#pageB .b1{font-size:96px;font-weight:900;color:#B4552F;letter-spacing:.02em}
#pageB .b2{font-size:56px;font-weight:900;color:#5E5148;letter-spacing:.01em}


/* ── 最後一版：彈出式服務卡 ── */
#pageC{position:absolute;inset:0;z-index:9;opacity:0;pointer-events:none;background:#fff;
 display:flex;align-items:center;justify-content:center;perspective:1600px}
#pageC.on{opacity:1;pointer-events:auto}
.pcard{width:1320px;background:linear-gradient(160deg,#191410,#0E0B09 70%);border-radius:34px;
 padding:62px 72px 58px;box-shadow:0 50px 140px rgba(0,0,0,.5),0 0 0 1px rgba(217,169,106,.22);
 transform:rotateX(12deg) translateY(90px) scale(.9);opacity:0;
 transition:transform .62s cubic-bezier(.18,.9,.2,1),opacity .4s ease-out}
#pageC.on .pcard{transform:rotateX(0) translateY(0) scale(1);opacity:1}
.phead{display:flex;align-items:center;justify-content:space-between;gap:30px;
 border-bottom:1px solid rgba(217,169,106,.22);padding-bottom:26px;margin-bottom:34px}
.phead .ptag{font-size:26px;letter-spacing:.30em;color:#C9A780;font-weight:900}
.phead .ptitle{font-size:64px;color:#FBF7F1;font-weight:900;letter-spacing:.02em;line-height:1.12;text-align:right}
.phead .ptitle i{font-style:normal;color:#D9A96A}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:20px 54px}
.pitem{display:flex;align-items:center;gap:20px;opacity:0;transform:translateY(22px);
 transition:opacity .32s ease-out,transform .38s cubic-bezier(.18,.9,.2,1)}
.pitem.on{opacity:1;transform:none}
.pdot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 18px currentColor}
.pitem .pn{font-size:44px;font-weight:900;color:#F3EADF;letter-spacing:.01em;line-height:1.15}
.pitem .pe{font-size:22px;color:#A08D7C;letter-spacing:.06em;margin-top:2px}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:44px;
 padding-top:30px;border-top:1px solid rgba(217,169,106,.22);opacity:0;transform:translateY(16px);
 transition:opacity .4s ease-out,transform .4s ease-out}
.pfoot.on{opacity:1;transform:none}
.pbtn{background:linear-gradient(100deg,#D9A96A,#B4552F);color:#1A120C;font-size:38px;font-weight:900;
 padding:20px 44px;border-radius:999px;letter-spacing:.02em;box-shadow:0 14px 40px rgba(180,85,47,.42)}
.pnote{font-size:26px;color:#B9A695;letter-spacing:.04em}

#hint{position:fixed;right:18px;bottom:14px;font-family:"PingFang HK",sans-serif;font-size:12px;color:rgba(255,255,255,.38)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="dark"></div>
  <div id="white"></div>
  <div id="flat">
    <div class="fpre" style="font-size:40px;letter-spacing:.24em;color:#9C8B80">PIPELINES</div>
    <div class="fmix" style="font-size:104px;margin-top:6px">組合唔同嘅 <i>AI 流水線</i></div>
    <div class="lines" id="lines"></div>
  </div>
  <div id="pageB">
    <div class="bpre">建立你嘅</div>
    <div class="bmain">一人公司<i>軍團</i></div>
    <div class="brule"></div>
    <div class="b1">多條流水線同時行</div>
    <div class="b2">唔係你請幾多人，係開幾多條線</div>
  </div>
  <div id="pageC">
    <div class="pcard" id="pcard">
      <div class="phead">
        <div class="ptag">仲有呢啲流水線</div>
        <div class="ptitle">其他日常，<i>都幫你頂住</i></div>
      </div>
      <div class="plist" id="plist"></div>
      <div class="pfoot" id="pfoot">
        <div class="pbtn">馬上同我哋聯絡</div>
        <div class="pnote">描述欄就有資料</div>
      </div>
    </div>
  </div>
</div></div>
<div id="hint">撳一下 → 下一步 · R 重播 · F 全屏</div>
<script>


const white=document.getElementById("white"), flat=document.getElementById("flat");
const dark=document.getElementById("dark");
const pageB=document.getElementById("pageB"), linesEl=document.getElementById("lines");
const NAMES8=["一條片出齊所有平台","AI 客戶開發","素材變內容","取代付費工具","活動流水線","AI 流水線建系統","每日自動搵料","營運 YouTube Channel"];
NAMES8.forEach(n=>{ const sp=document.createElement("span"); sp.innerHTML=n+"<i></i>"; linesEl.appendChild(sp); });

/* 最後一版：彈出式服務卡 */
const pageC=document.getElementById("pageC"), pcard=document.getElementById("pcard");
const plist=document.getElementById("plist"), pfoot=document.getElementById("pfoot");
const SVC=[["會計","Bookkeeping","#FF6B35"],["行政","HR","#FFC93C"],["客戶服務","Customer Care","#D9A96A"],
           ["社交媒體","Social Media","#B4552F"],["設計出圖","Design","#FF8FA3"],["網站維護","Website","#E8CFC2"]];
SVC.forEach(([n,e,c])=>{ const d=document.createElement("div"); d.className="pitem";
  d.innerHTML='<span class="pdot" style="background:'+c+';color:'+c+'"></span>'
    +'<span><span class="pn">'+n+'</span><br><span class="pe">'+e+'</span></span>';
  plist.appendChild(d); });
const pitems=[...plist.querySelectorAll(".pitem")];
let cTimers=[];


let step=0, ac=null, out=null, muted=false, raf=0, t0=0;
function audio(){ try{ if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
 ac=new AC(); out=ac.createGain(); out.gain.value=.5; out.connect(ac.destination); if(muted) out.gain.value=0; }
 if(ac.state==="suspended") ac.resume(); return ac; }catch(e){ return null; } }
function tick(f=200){ if(!ac||muted) return; const t=ac.currentTime;
 const len=Math.floor(ac.sampleRate*0.05); const b=ac.createBuffer(1,len,ac.sampleRate); const d=b.getChannelData(0);
 for(let i=0;i<len;i++){ const e=1-i/len; d[i]=(Math.random()*2-1)*e*e; }
 const src=ac.createBufferSource(); src.buffer=b; const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1500;
 const g=ac.createGain(); g.gain.value=.3; src.connect(hp); hp.connect(g); g.connect(out); src.start(t); src.stop(t+.06);
 const o=ac.createOscillator(), g2=ac.createGain(); o.type="square";
 o.frequency.setValueAtTime(f*2.1,t); o.frequency.exponentialRampToValueAtTime(f*.65,t+.06);
 g2.gain.setValueAtTime(.0001,t); g2.gain.exponentialRampToValueAtTime(.16,t+.008);
 g2.gain.exponentialRampToValueAtTime(.0001,t+.07);
 o.connect(g2); g2.connect(out); o.start(t); o.stop(t+.09); }
function boom(){ if(!ac||muted) return; const t=ac.currentTime;
 const o=ac.createOscillator(), g=ac.createGain(); o.type="sine";
 o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.5);
 g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.42,t+.015);
 g.gain.exponentialRampToValueAtTime(.0001,t+.55);
 o.connect(g); g.connect(out); o.start(t); o.stop(t+.6); }

/* 液態流光：一直行，唔關頁數事 */

function reset(){
  step=0;
  cTimers.forEach(clearTimeout); cTimers=[];
  dark.style.opacity=0; white.style.opacity=0; flat.style.opacity=1; pageB.style.opacity=0;
  pageC.classList.remove("on");
  pitems.forEach(el=>el.classList.remove("on")); pfoot.classList.remove("on");
  pcard.style.transition="none"; pcard.style.opacity=""; pcard.style.transform="";
  void pcard.offsetWidth;
  requestAnimationFrame(()=>{ pcard.style.transition=""; });
}
function toC(){
  step=2; audio(); boom(); tick(240);
  pageC.classList.add("on");
  cTimers.push(setTimeout(()=>{ pcard.style.transition=""; }, 30));
  pitems.forEach((el,i)=>{ cTimers.push(setTimeout(()=>{ el.classList.add("on"); tick(320+i*36); }, 300+i*150)); });
  cTimers.push(setTimeout(()=>{ pfoot.classList.add("on"); tick(540); }, 300+pitems.length*150+120));
}
function toB(){
  step=1; audio(); boom(); tick(210);
  flat.style.opacity=0; pageB.style.opacity=1;
}
const NEXT_DECK="one-video-pipeline";
function goNextDeck(){
  try{ if(window.self!==window.top){ parent.location.hash="#"+NEXT_DECK; return; } }catch(e){}
  location.href="../"+NEXT_DECK+"/";
}
function advance(){
  if (step===0){ toB(); }
  else if (step===1){ toC(); }
  else { goNextDeck(); }
}
addEventListener("click", advance);
function goPrevDeck(){
  try{ if (window.self !== window.top){ parent.postMessage({ type:"goto", id:"youtube-pipeline-flow-end" }, "*"); return; } }catch(e){}
  location.href = "../youtube-pipeline-flow/?at=end";
}
function back(){
  if (step===2){
    cTimers.forEach(clearTimeout); cTimers=[];
    pageC.classList.remove("on"); pageB.style.opacity=1; step=1;
  } else if (step===1){
    pageB.style.opacity=0; flat.style.opacity=1; step=0;
  } else {
    goPrevDeck();
  }
}
addEventListener("keydown", e=>{
  if (e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown") advance();
  else if (e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace") back();
  else if (e.key==="r"||e.key==="R") reset();
  else if (e.key==="m"||e.key==="M"){ muted=!muted; if(out) out.gain.value=muted?0:.5; }
  else if (e.key==="f"||e.key==="F"){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
  else if (e.key==="h"||e.key==="H"){ document.getElementById("hint").style.display="none"; }
});
function fit(){ const w=innerWidth,h=innerHeight,s=Math.min(w/1920,h/1080);
  document.getElementById("stage").style.transform=`translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`; }
addEventListener("resize",fit); fit();
reset();

</script>
<div style="display:none">組合唔同嘅 AI 流水線 建立你嘅一人公司軍團 多條流水線同時行 唔係你請幾多人 係開幾多條線 重播 全屏</div>
<script>
/* gesture bridge：向下撳／向下滑＝下一版，向上撳／向上滑＝上一版 */
(function(){
  if (window.__gestureBridge) return;
  window.__gestureBridge = true;
  var lock = 0, swallow = false;
  function fire(key){
    window.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true, cancelable: true }));
  }
  var lockDir = { up: 0, down: 0 };
  window.addEventListener("wheel", function(e){
    if (Math.abs(e.deltaY) < 22) return;
    var dir = e.deltaY > 0 ? "down" : "up", now = Date.now();
    if (now - lockDir[dir] < 620) return;
    lockDir[dir] = now;
    fire(dir === "down" ? "ArrowRight" : "ArrowLeft");
  }, { passive: true });
  var ty = 0, tx = 0;
  window.addEventListener("touchstart", function(e){
    var t = e.touches[0]; ty = t.clientY; tx = t.clientX;
  }, { passive: true });
  window.addEventListener("touchend", function(e){
    var t = e.changedTouches[0], dy = t.clientY - ty, dx = t.clientX - tx;
    if (Math.abs(dy) < 54 || Math.abs(dy) < Math.abs(dx)) return;
    swallow = true;
    setTimeout(function(){ swallow = false; }, 420);
    fire(dy < 0 ? "ArrowLeft" : "ArrowRight");
  }, { passive: true });
  window.addEventListener("click", function(e){
    if (swallow){ e.stopPropagation(); e.preventDefault(); swallow = false; }
  }, true);
})();
</script>
<script>
/* endboot */
if (location.search.indexOf("at=end") >= 0) setTimeout(function(){ try{ toC(); }catch(e){} }, 80);
</script>
<script>
if (!window.__escBridge){ window.__escBridge = true;
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ try{ parent.postMessage({ type:"escape" }, "*"); }catch(err){} }
  });
}
</script>
</body>
</html>
