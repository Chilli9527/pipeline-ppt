:root{
  --ink:#FFFFFF; --dim:#9A8F96; --line:rgba(255,255,255,.10);
  --yt:#FF0033;
  --cn:"NotoTC Black","PingFang HK","PingFang TC","Heiti TC",sans-serif;
  --num:"NotoTC Black","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--cn);-webkit-font-smoothing:antialiased;cursor:pointer}

#wrap{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;
  transform-origin:0 0;background:#08080B}

/* ── 背景 ── */
.bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;will-change:transform;
  animation:drift var(--d) ease-in-out infinite alternate;filter:blur(0px)}
@keyframes drift{from{transform:translate3d(calc(var(--x)*-1),calc(var(--y)*-1),0)}
  to{transform:translate3d(var(--x),var(--y),0)}}
.grid{position:absolute;inset:-60px;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:80px 80px}
.vig{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 45%,
  transparent 30%,rgba(0,0,0,.78) 100%)}

/* ── 頂部 ── */
.top{position:absolute;left:72px;right:72px;top:52px;display:flex;align-items:center;
  justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:900;
  letter-spacing:.02em;color:rgba(255,255,255,.72)}
.brand svg{width:44px;height:31px}
.page{font-family:var(--num);font-size:18px;letter-spacing:.22em;color:rgba(255,255,255,.34)}

/* ── 進度條（七格） ── */
.rail{position:absolute;left:72px;right:72px;bottom:52px;display:flex;gap:10px}
.rail i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.13);
  transition:background .5s ease,box-shadow .5s ease}
.rail i.on{background:var(--c);box-shadow:0 0 14px var(--c)}

/* ── 版面 ── */
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;
  transition:opacity .45s ease,transform .6s cubic-bezier(.16,.84,.34,1);
  transform:scale(1.015)}
.slide.on{opacity:1;transform:none;pointer-events:auto}

.left{position:absolute;left:96px;top:150px;width:940px;bottom:150px;
  display:flex;flex-direction:column;justify-content:center}

.stepno{font-family:var(--num);font-size:132px;line-height:.86;font-weight:900;
  color:transparent;-webkit-text-stroke:2px var(--c);opacity:.9;letter-spacing:-.04em}
.stepno b{display:inline-block;transition:transform .5s cubic-bezier(.2,.9,.25,1.1)}
.slide.on .stepno b{transform:none}

h2{margin:26px 0 0;font-size:96px;line-height:1.04;font-weight:900;
  letter-spacing:-.015em;color:var(--ink)}
h2 em{font-style:normal;color:var(--c)}
.line{margin:30px 0 0;font-size:40px;line-height:1.45;font-weight:900;color:rgba(255,255,255,.82)}

/* 進場動效 */
.anim{opacity:0;transform:translateY(26px)}
.slide.on .anim{animation:up .7s cubic-bezier(.2,.85,.25,1) forwards;
  animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}

/* ── 右邊道具 ── */
.prop{position:absolute;right:96px;top:150px;width:700px;bottom:150px;
  display:flex;align-items:center;justify-content:center}
.pcard{width:100%;border-radius:26px;background:linear-gradient(180deg,
  rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);
  padding:34px 36px;box-shadow:0 30px 80px rgba(0,0,0,.5)}

/* 01 定題 */
.field{display:flex;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{width:120px;font-size:22px;color:rgba(255,255,255,.45)}
.field .v{flex:1;height:22px;border-radius:6px;
  background:linear-gradient(90deg,var(--c),rgba(255,255,255,.10))}
.field .v.s{width:52%;background:rgba(255,255,255,.16)}

/* 02 寫稿 */
.script-line{height:20px;border-radius:6px;background:rgba(255,255,255,.16);margin:22px 0}
.script-line.hi{background:linear-gradient(90deg,var(--c),rgba(255,0,51,.15));height:26px}
.script-line:nth-child(2){width:86%}
.script-line:nth-child(3){width:74%}
.script-line:nth-child(4){width:92%}
.ticks{display:flex;gap:8px;margin-top:20px}
.ticks i{width:38px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.ticks i.on{background:var(--c)}

/* 03 配音 */
.wave{display:flex;align-items:center;gap:7px;height:150px}
.wave i{width:11px;border-radius:6px;background:var(--c);opacity:.85;
  animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.mic{display:flex;align-items:center;gap:14px;margin-top:26px;font-size:22px;
  color:rgba(255,255,255,.5)}

/* 04 出圖 */
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.frame{aspect-ratio:4/3;border-radius:12px;background:
  linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:1px solid var(--line);position:relative;overflow:hidden}
.frame::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}
.host{margin-top:16px;height:74px;border-radius:12px;border:2px dashed var(--c);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  color:var(--c);letter-spacing:.12em}

/* 05 配樂 + 字幕 */
.bar{height:54px;border-radius:10px;border:1px solid var(--line);position:relative;
  overflow:hidden;margin-bottom:16px}
.bar .fill{position:absolute;inset:0 42% 0 0;background:
  linear-gradient(90deg,var(--c),rgba(255,255,255,.10))}
.bar .lbl{position:absolute;right:16px;top:16px;font-size:18px;color:rgba(255,255,255,.55)}
.cap-row{height:56px;border-radius:10px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;padding:0 20px;font-size:24px;margin-top:12px;
  color:rgba(255,255,255,.8)}
.cap-row.on{background:linear-gradient(90deg,rgba(255,0,51,.22),rgba(255,255,255,.05));
  border-left:4px solid var(--c)}

/* 06 剪接 */
.tl{position:relative;height:110px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);padding:14px}
.clips{display:flex;gap:8px;height:54px}
.clip{flex:1;border-radius:8px;background:linear-gradient(180deg,var(--c),rgba(255,255,255,.08))}
.clip:nth-child(even){background:rgba(255,255,255,.18)}
.playhead{position:absolute;top:8px;bottom:8px;width:3px;background:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.9);left:38%}
.tl .track{margin-top:12px;height:14px;border-radius:7px;background:rgba(255,255,255,.10)}

/* 出動畫 */
.motionbox{display:flex;flex-direction:column;gap:22px;align-items:center;padding:6px 0}
.playdot{width:120px;height:120px;border-radius:50%;border:2px solid var(--c);
  display:grid;place-items:center;box-shadow:0 0 34px rgba(255,255,255,.10)}
.playdot span{display:block;width:0;height:0;border-left:34px solid var(--c);
  border-top:22px solid transparent;border-bottom:22px solid transparent;margin-left:8px}
.motionrow{display:flex;gap:8px;align-items:flex-end;height:34px}
.motionrow i{width:14px;border-radius:4px;background:var(--c);opacity:.8;
  animation:mwave 1.4s ease-in-out infinite}
.motionrow i:nth-child(1){height:14px;animation-delay:-.12s}
.motionrow i:nth-child(2){height:26px;animation-delay:-.24s}
.motionrow i:nth-child(3){height:34px;animation-delay:-.36s}
.motionrow i:nth-child(4){height:24px;animation-delay:-.48s}
.motionrow i:nth-child(5){height:30px;animation-delay:-.6s}
.motionrow i:nth-child(6){height:18px;animation-delay:-.72s}
@keyframes mwave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

/* 07 上載 */
.yt-card{display:flex;gap:26px;align-items:center}
.yt-card svg{width:132px;height:92px;flex-shrink:0}
.yt-meta{flex:1}
.yt-meta .t{height:24px;border-radius:6px;background:rgba(255,255,255,.22);margin-bottom:14px}
.yt-meta .t.s{width:62%;background:rgba(255,255,255,.12)}
.pills{display:flex;align-items:center;gap:16px;margin-top:20px}
.pill{font-size:20px;padding:9px 20px;border-radius:999px;border:1px solid var(--line);
  color:rgba(255,255,255,.55)}
.pill.hot{background:var(--yt);border-color:var(--yt);color:#fff}
.arrow{color:rgba(255,255,255,.35);font-size:22px}

/* 08 收尾：流水線 */
.pipe{position:absolute;left:140px;top:520px;
  width:1640px;height:210px;border-radius:105px;
  background:linear-gradient(100deg,rgba(255,0,51,.16),rgba(255,255,255,.05));
  border:1.5px solid rgba(255,0,51,.45);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 90px rgba(255,0,51,.22)}
.pipe .mini{position:relative;display:flex;align-items:center;justify-content:center}
.pipe .rail2{position:absolute;height:2.5px;left:0;width:100%;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,.25),var(--yt));z-index:1}
.pipe .m{position:relative;z-index:2;width:200px;display:flex;flex-direction:column;
  align-items:center;gap:10px}
.pipe .dot{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;
  background:#0A0A0D;border:1.5px solid var(--c);color:var(--c);
  box-shadow:0 0 24px rgba(255,255,255,.06)}
.pipe .dot svg{width:48px;height:48px}
.pipe span{font-size:23px;font-weight:900;color:rgba(255,255,255,.86);white-space:nowrap}
.bigline{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:76px;
  font-weight:900;line-height:1.2;color:#fff}
.bigline i{font-style:normal;color:var(--yt)}

#hint{position:fixed;left:18px;bottom:14px;z-index:20;font-family:var(--num);
  font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.3);user-select:none}
body.nohud #hint{display:none}

/* ── 置頂：返回總目錄 ── */
#homeLink{position:fixed;left:16px;top:16px;z-index:60;
  font-family:"PingFang HK","Heiti TC",sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.1em;color:rgba(255,255,255,.78);text-decoration:none;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:9px 15px;backdrop-filter:blur(8px);
  transition:background .25s,color .25s,opacity .25s}
#homeLink:hover{background:rgba(0,0,0,.72);color:#fff}
body.nohud #homeLink{opacity:0;pointer-events:none}
</style>
</head>
<body>
<a id="homeLink" href="../index.html" target="_top">☰ 總目錄</a>
<script>if(window.self!==window.top){var _h=document.getElementById("homeLink");if(_h)_h.style.display="none";}</script>


<div id="wrap"><div id="stage">
  <div class="bg" id="bg"></div>
  <div class="grid"></div>
  <div class="vig"></div>

  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 28 20"><rect x="0" y="0" width="28" height="20" rx="5.5" fill="#FF0033"/><path d="M11 5.6l7.6 4.4L11 14.4z" fill="#fff"/></svg>
      做一條口播 Video，上載去 YouTube Channel
    </div>
    <div class="page" id="page">01 / 08</div>
  </div>

  <div id="slides"></div>

  <div class="rail" id="rail"></div>
</div></div>
<div id="hint">撳一下／空白 → 下一頁　·　F 全螢幕　·　H 收埋</div>

<script>
/* ══════════════════════════════════════════════════════════ */
const YTSVG = '<svg viewBox="0 0 28 20"><rect x="0" y="0" width="28" height="20" rx="5.5" fill="#FF0033"/><path d="M11 5.6l7.6 4.4L11 14.4z" fill="#fff"/></svg>';

const ICONS = {
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/><path d="M9 7h10M9 12h10M9 17h6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4 16.5z"/><path d="M13.5 7.5L16 10"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  cut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="6" cy="6" r="2.5"/><path d="M20 4L8.5 16.5M8.5 7.5L20 20"/></svg>',
  motion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2.5"/><path d="M8.2 9.6l4 2.4-4 2.4z" fill="currentColor" stroke="none"/><path d="M19 8.5c1.1 2.2 1.1 4.8 0 7"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>',
};

const DECK = [
  { n:"01", name:"定題", accent:"#FF2D55", line:"一句講清講咩、畀邊個睇。",
    prop:`<div class="pcard">
      <div class="field"><span class="k">主題</span><span class="v"></span></div>
      <div class="field"><span class="k">觀眾</span><span class="v s"></span></div>
      <div class="field"><span class="k">片長</span><span class="v s"></span></div>
    </div>` },

  { n:"02", name:"寫稿", accent:"#FF5F3D", line:"廣東話口語寫，頭五秒要勾住人。",
    prop:`<div class="pcard">
      <div class="script-line hi"></div>
      <div class="script-line"></div>
      <div class="script-line"></div>
      <div class="script-line"></div>
      <div class="ticks"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
    </div>` },

  { n:"03", name:"配音", accent:"#FF9F1C", line:"地道廣東話，斷句要似人講嘢。",
    prop:`<div class="pcard">
      <div class="wave" id="wave"></div>
      <div class="mic"><span style="width:34px;height:34px;color:var(--c)">${ICONS.mic}</span>地道廣東話 · 斷句自然</div>
    </div>` },

  { n:"04", name:"出圖", accent:"#FFD166", line:"每段一張圖，主角位一早定好。",
    prop:`<div class="pcard">
      <div class="frames">
        <div class="frame"></div><div class="frame"></div><div class="frame"></div>
      </div>
      <div class="host">主角出鏡位</div>
    </div>` },

  { n:"05", name:"出動畫", accent:"#FF7AB6", line:"每段加動態，唔好得一張死圖。",
    prop:`<div class="pcard">
      <div class="motionbox">
        <div class="playdot"><span></span></div>
        <div class="motionrow"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>` },

  { n:"06", name:"配樂＋字幕", accent:"#4ED6C4", line:"音樂壓低，字幕逐句上。",
    prop:`<div class="pcard">
      <div class="bar"><div class="fill"></div><div class="lbl">BGM −18 dB</div></div>
      <div class="cap-row on">呢條片，我自己一個人做，七步。</div>
      <div class="cap-row">一，定題。</div>
    </div>` },

  { n:"07", name:"剪接", accent:"#5BA8FF", line:"一句一個動作，唔好一路靜。",
    prop:`<div class="pcard">
      <div class="tl">
        <div class="clips"><div class="clip"></div><div class="clip"></div><div class="clip"></div><div class="clip"></div><div class="clip"></div></div>
        <div class="playhead"></div>
        <div class="track"></div>
      </div>
    </div>` },

  { n:"08", name:"上載", accent:"#FF0033", line:"出草案，你批完，才上 YouTube。",
    prop:`<div class="pcard">
      <div class="yt-card">
        ${YTSVG}
        <div class="yt-meta"><div class="t"></div><div class="t s"></div></div>
      </div>
      <div class="pills">
        <span class="pill">未公開</span><span class="arrow">→</span><span class="pill hot">公開</span>
      </div>
    </div>` },
];

const FINAL = { n:"09", name:"一條流水線", accent:"#FF0033",
  big:`八步，串成<i>一條流水線</i>` };

/* ── 背景 ── */
(function bg(){
  const cols = ["#FF0033","#FF5F3D","#7C5CFF","#4ED6C4"];
  const hex = (c)=>{const n=parseInt(c.slice(1),16);return `${n>>16&255},${n>>8&255},${n&255}`;};
  const L=[[.16,.18,620],[.78,.12,560],[.34,.92,640],[.92,.84,480]];
  document.getElementById("bg").innerHTML = L.map((p,k)=>{
    const c=cols[k%4];
    return `<div class="blob" style="left:${(p[0]*1920-p[2]).toFixed(0)}px;top:${(p[1]*1080-p[2]).toFixed(0)}px;
      width:${p[2]*2}px;height:${p[2]*2}px;
      background:radial-gradient(circle,rgba(${hex(c)},.13) 0%,rgba(${hex(c)},.04) 42%,rgba(0,0,0,0) 70%);
      --x:${(26+Math.random()*40).toFixed(0)}px;--y:${(20+Math.random()*34).toFixed(0)}px;
      --d:${(12+Math.random()*8).toFixed(1)}s"></div>`;
  }).join("");
})();

/* ── 建 deck ── */
const host = document.getElementById("slides");
const railEl = document.getElementById("rail");
const pageEl = document.getElementById("page");
const TOTAL = DECK.length + 1;

DECK.forEach((d)=>{
  const sec = document.createElement("section");
  sec.className = "slide";
  sec.style.setProperty("--c", d.accent);
  sec.innerHTML = `
    <div class="left">
      <div class="stepno anim" style="--d:.05s"><b>${d.n}</b></div>
      <h2 class="anim" style="--d:.12s">${d.name}</h2>
      <p class="line anim" style="--d:.2s">${d.line}</p>
    </div>
    <div class="prop anim" style="--d:.26s">${d.prop}</div>`;
  host.appendChild(sec);
});

/* 最終頁 */
const fin = document.createElement("section");
fin.className = "slide";
fin.style.setProperty("--c", FINAL.accent);
fin.innerHTML = `
  <div class="bigline anim" style="--d:.05s">${FINAL.big}</div>
  <div class="pipe anim" style="--d:.2s">
    <div class="mini" id="mini"></div>
  </div>`;
host.appendChild(fin);

const miniEl = fin.querySelector(".mini");
const NAMES = DECK.map((d)=>d.name);
const ICONS_KEYS = ["pen","note","mic","img","motion","music","cut","upload"];
const rail2 = document.createElement("div");
rail2.className = "rail2";
miniEl.appendChild(rail2);
NAMES.forEach((nm,i)=>{
  const m = document.createElement("div");
  m.className = "m";
  m.style.setProperty("--c", DECK[i].accent);
  m.innerHTML = `<div class="dot">${ICONS[ICONS_KEYS[i]] || ICONS.list}</div><span>${nm}</span>`;
  miniEl.appendChild(m);
});

/* 波形 */
(function wave(){
  const w = document.getElementById("wave");
  if (!w) return;
  for (let i=0;i<26;i++){
    const b = document.createElement("i");
    const h = 22 + Math.abs(Math.sin(i*1.7)) * 104;
    b.style.height = h + "px";
    b.style.animationDelay = (-i*0.07).toFixed(2) + "s";
    b.style.opacity = (0.45 + Math.random()*0.5).toFixed(2);
    w.appendChild(b);
  }
})();

/* 進度格 */
for (let i=0;i<TOTAL;i++){
  const t = document.createElement("i");
  railEl.appendChild(t);
}

const slides = [...document.querySelectorAll(".slide")];
let cur = -1;

function show(i){
  i = Math.max(0, Math.min(TOTAL-1, i));
  if (i === cur) return;
  cur = i;
  slides.forEach((s,si)=>s.classList.toggle("on", si===i));
  [...railEl.children].forEach((t,ti)=>{
    t.classList.toggle("on", ti<=i);
    t.style.setProperty("--c", ti < DECK.length ? DECK[ti].accent : FINAL.accent);
  });
  pageEl.textContent = String(i+1).padStart(2,"0") + " / " + String(TOTAL).padStart(2,"0");
  if (i === TOTAL-1) setTimeout(layoutRail2, 60);
  history.replaceState(null, "", "#" + (i+1));
}

/* 最終頁條線：只喺圓與圓之間 */
function layoutRail2(){
  const dots = [...miniEl.querySelectorAll(".dot")];
  if (dots.length < 2) return;
  const mr = miniEl.getBoundingClientRect();
  const k = mr.width / miniEl.offsetWidth || 1;
  const a = dots[0].getBoundingClientRect(), b = dots[dots.length-1].getBoundingClientRect();
  const cx1 = (a.left - mr.left)/k + a.width/(2*k);
  const cx2 = (b.left - mr.left)/k + b.width/(2*k);
  const cy  = (a.top - mr.top)/k + a.height/(2*k);
  rail2.style.left = cx1 + "px";
  rail2.style.width = (cx2-cx1) + "px";
  rail2.style.top = (cy - 1.25) + "px";
}

/* 操作 */
function next(){ show(cur+1); }
function prev(){ show(cur-1); }
document.getElementById("stage").addEventListener("click", next);
addEventListener("keydown", (e)=>{
  const k = e.key;
  if ([" ","ArrowRight","ArrowDown","PageDown","Enter"].includes(k)){ e.preventDefault(); next(); }
  else if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){ e.preventDefault(); prev(); }
  else if (k === "Home") show(0);
  else if (k === "End") show(TOTAL-1);
  else if (k === "f" || k === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === "h" || k === "H") document.body.classList.toggle("nohud");
  else if (k === "r" || k === "R") show(0);
});

/* 縮放 */
function fit(){
  const vv = window.visualViewport;
  const w = Math.max(1, Math.floor(vv ? vv.width : innerWidth));
  const h = Math.max(1, Math.floor(vv ? vv.height : innerHeight));
  const s = Math.min(w/1920, h/1080);
  document.getElementById("stage").style.transform =
    `translate(${Math.round((w-1920*s)/2)}px,${Math.round((h-1080*s)/2)}px) scale(${s})`;
  requestAnimationFrame(layoutRail2);
}
addEventListener("resize", fit);
if (window.visualViewport) visualViewport.addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
fit();

const m = location.hash.match(/^#(\d+)$/);
show(m ? +m[1]-1 : 0);
</script>
<script>
if (!window.__escBridge){ window.__escBridge = true;
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ try{ parent.postMessage({ type:"escape" }, "*"); }catch(err){} }
  });
}
</script>
